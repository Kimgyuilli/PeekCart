spring:
  datasource:
    url: jdbc:mysql://mysql:3306/peekcart_payment?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:peekcart_payment}
    password: ${DB_PASSWORD:peekcart_payment}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: redis
      port: 6379
  kafka:
    bootstrap-servers: kafka:29092

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    com.peekcart: INFO

# Toss 자격증명 — k8s 에서는 기본값 없이 강제. 누락 시 placeholder 미해석으로 부팅 실패(fail-fast).
# (base application.yml 의 test placeholder 가 운영에 새지 않도록 stub 금지.)
toss:
  payments:
    secret-key: ${TOSS_SECRET_KEY}
    webhook-secret: ${TOSS_WEBHOOK_SECRET}
    # base-url 은 자격증명이 아니라 **endpoint** 다 — 이 파일이 datasource.url·redis.host 를
    # 리터럴로 선언하는 것과 같은 부류다. 기본값 없이 강제하면 operator 가 값을 주입하기
    # 전까지 부팅이 실패하고(실측: health smoke 와 k8s 배포가 그렇게 깨졌다) 얻는 안전은 없다
    # — 누락될 값 자체가 없어지는 쪽이 낫다. 환경변수로 덮을 수는 있게 둔다.
    base-url: ${TOSS_BASE_URL:https://api.tosspayments.com/v1}
