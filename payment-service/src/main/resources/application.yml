spring:
  application:
    name: payment-service
  profiles:
    active: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    # DB-per-service (구현 ② PR2): 자기 스키마(peekcart_payment)에 자기 모듈 마이그레이션만 적용.
    enabled: true
    locations: classpath:db/migration
  kafka:
    # ADR-0020 D4-1 — NewTopic 선언만으로는 **기존** 토픽 config 가 바뀌지 않는다
    # (KafkaAdmin.modifyTopicConfigs 기본값 false). 동작 규약이라 base 소유(ADR-0007).
    admin:
      modify-topic-configs: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 3000
        request.timeout.ms: 3000
        delivery.timeout.ms: 5000
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        # deadletter: DLQ 원장 backlog 조회 (구현 ④-c-2a P10). 메트릭 계약(④-d) 전까지 유일한 조회 표면.
        include: health,prometheus,deadletter
  metrics:
    tags:
      application: payment-service

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

app:
  # Gateway 서명 내부 토큰 검증 (ADR-0017 D3 · 구현 ③ PR3d).
  # 공개키는 비밀이 아니므로 이미지에 베이크한다(운영 kid 교체는 k8s ConfigMap — PR3d-b).
  # [중요] gateway kid 를 app.jwt.rs256.public-keys 에 넣지 않는다 — User JWKS 가 레지스트리를 전량
  # 게시하므로 내부 신뢰 앵커가 외부에 노출된다(ADR-0017 D3, internal-key-ownership-lint 로 강제).
  internal-token:
    mode: SIGNED_ONLY
    public-keys:
      - kid: peekcart-gateway-dev-2026
        location: classpath:keys/dev-gateway-internal-public.pem
  # 결제 승인 정책 (계획 ④-a) — 동작 정책이므로 base 소유(ADR-0007).
  # 남은 예약 lease 가 이 마진보다 짧으면 승인을 시작하지 않는다(PAY-010).
  # fence 가 아니라 경합 창 축소이며, 잔여 위험은 계획 §2.6 R-1 로 추적한다.
  payment:
    lease-approval-margin: 2m
  # 환불 경로 동작 정책 (ADR-0018 · 구현 ④-c-1a) — 동작 정책이므로 base 소유(ADR-0007).
  # claim-lease 는 PG 호출 최악 소요(pg-timeout × max-attempts + 백오프 총합)보다 길어야 한다 —
  # 짧으면 살아있는 claim 을 다른 인스턴스가 회수해 같은 결제에 취소를 두 번 시도한다(부팅 시 fail-fast).
  refund:
    claim-lease: 5m
    pg-timeout: 10s
    max-attempts: 3
    retry-backoff: 2s
    batch-size: 5
    max-batches-per-run: 2     # 앞 배치가 계속 미확정이어도 뒤 배치가 굶지 않게 한다
    unresolved-limit: 24h      # 초과 시 자동 확정 포기 → 운영 알림 + 수동 종결(감사 필드 필수)
    dispatch-interval-ms: 30000
    reconcile-interval-ms: 300000
    lock-at-most-for: 20m      # 1회 실행 최악(건당 66s × 5 × 2 = 11m) 보다 길어야 함(부팅 시 fail-fast)

  # processed_events 멱등성 보존 정책 (ADR-0012 D5 · 구현 ② PR3) — 동작 정책이므로 base 소유(ADR-0007).
  idempotency:
    retention: 9d          # floor 4창 max(7d) 이상 + ADR-0020 D4-3 replay 안전여유(dlq-replay-window 7d + clock-skew 5m + cleanup-safety 1d = 8d 5m) 이상 — 미만이면 부팅 실패
    # ADR-0020 D4-3 — 등호 허용(7d==7d)은 창 끝을 보장하지 못한다. 여유를 설정으로 강제한다.
    clock-skew-budget: 5m       # 서비스 간 시계 오차 (processed_at 이 각 서비스 로컬 시각)
    cleanup-safety-budget: 1d   # 정리 잡이 일 1회라 삭제가 최대 1일 늦는다
    floor:
      kafka-topic-retention: 7d
      max-consumer-downtime: 24h
      dlq-replay-window: 7d
      backfill-replay-window: 7d
    cleanup:
      batch-size: 500
      max-batches-per-run: 20
  outbox:
    retention: 7d          # PUBLISHED outbox_events 보존기간 (구현 ② PR3)
    # 공유 DB 전환기 poller 소유권 분리 (Payment peel): payment 는 PAYMENT 이벤트만 발행.
    lock-name: paymentOutboxPollingJob
    polling:
      batch-size: 100
      max-retry: 5
      publish-timeout: 6s
      cycle-timeout: 4m

# Slack: payment 는 DLQ·결제 알림에 SlackPort 를 생성자 주입하나 발송은 비핵심.
# webhook 미설정 + no-op fallback 으로 부팅 보장 (PR3b GP-2 loop3 — presence-based
# @ConditionalOnProperty(slack.webhook.url) 가 placeholder 기본값에 항상 매치되던 문제 제거).
  # DLQ 원장 운영 계약 (구현 ④-c-2a P5) — 동작 정책이므로 base 소유(ADR-0007).
  dead-letter:
    cluster-id: peekcart-local
    # 토픽별 프로비저닝 세대. 토픽을 삭제·재생성하면 배포 전에 값을 올린다.
    # 미등록 토픽을 참조하면 부팅이 아니라 적재 시점에 예외 — 기본값 암묵 허용 금지(§2.5).
    # 키는 원본 토픽 이름이다. origin 헤더 판독 실패 행(DLQ_ORIGIN)은 좌표로 '<topic>.dlq' 를 싣지만,
    # .dlq 는 원본과 함께 선언·재생성되므로 원본의 세대를 따른다(정확 일치 우선 → 없으면 .dlq 제거 후 재조회).
    topic-generations:
      order.created: 1
      order.cancelled: 1
      stock.reservation.result: 1
      stock.compensation.requested: 1
      order.compensation.requested: 1
      payment.completed: 1
      payment.failed: 1
      payment.requested: 1
      payment.refunded: 1
    alert:
      stale-after: 24h     # 이 시간을 넘긴 미결은 경보 대상
      backlog-threshold: 50
      cooldown: 6h         # 같은 경보 재발송 억제 — 없으면 스케줄 주기마다 도배된다
      scan-limit: 100
    payload:
      max-length: 8000     # 초과분은 잘리고 payload_truncated 로 표시
    # replay 개시 kill-switch (④-c-2b-4a P21). **기본값 false 가 계약이다** — 배포 순간 진입점이
    # 열리면 backfill·증적·리허설 이전에 replay 가 가능해지고, 닫는 데 롤링 재기동이 또 든다.
    # drain·롤백 계약(④-c-2b-4b)이 서기 전까지 운영에서 열지 않는다. 동작 정책이므로 base 소유(ADR-0007).
    replay:
      enabled: false
    purge:
      retention: 90d       # DISCARDED 후 보존기간. OPEN/ACKED 는 삭제 대상이 아니다
      batch-size: 500
      max-batches-per-run: 20

slack:
  noop-fallback:
    enabled: true

toss:
  payments:
    secret-key: ${TOSS_SECRET_KEY:test_sk_placeholder}
    webhook-secret: ${TOSS_WEBHOOK_SECRET:test_webhook_secret_placeholder}
    # [ADR-0007] base-url 은 환경마다 갈리는 연결 정보다(운영 실 PG · 로컬 · E2E stub).
    # 기본값은 secret-key 와 같은 패턴의 **도달 불가 sentinel** — discard 포트(9)라 설정 누락이
    # 조용히 실 PG 로 나가지 않는다. 운영값은 application-k8s.yml 이 기본값으로 선언한다(계획 P1).
    # (k8s 는 fail-fast 하지 않는다 — base-url 은 endpoint 라 누락될 값 자체를 없애는 쪽을 택했다.)
    base-url: ${TOSS_BASE_URL:http://localhost:9/toss-base-url-not-configured}
