# cross-service saga E2E 스택 (계획 P3 · P4).
#
# 루트 docker-compose.yml 과 **별도 파일**이다. 그쪽은 개발 편의를 위해 container_name 과
# 호스트 포트를 고정하는데, 그러면 project 이름을 바꿔도 두 스택을 동시에 못 띄운다.
#
# 격리 계약 3가지:
#   1) container_name 없음 · 호스트 포트 미노출  → 같은 머신에서 project 여럿 병렬 기동 가능
#   2) 모든 서비스가 internal:true 네트워크 **하나에만** 부착 → 외부 egress 자체가 불가능
#      (N2 — "빈이 없어서 안 부른다" 가 아니라 네트워크 수준에서 막는다)
#   3) volume 은 매 실행 새로 만든다 → P4 가 run_id marker 로 판정
#
# 앱은 order/product/payment/notification 4개다. saga 체인에 참여하지 않는 user-service 와,
# HTTP 표면을 쓰지 않으므로 필요 없는 gateway 는 제외한다(계획 §9-6).

name: peekcart-e2e

x-app-env: &app-env
  # 프로파일은 local 을 쓰고 연결 정보만 환경변수로 덮는다 — 새 프로파일 yml 을 만들면
  # ADR-0007 이 금지하는 "환경 하나 늘 때마다 yml 하나" 가 된다.
  SPRING_PROFILES_ACTIVE: local
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  # 전환기 평문 헤더 모드(ADR-0014 D2-c 이전부터 있던 운영 지원 모드).
  # runner 가 gateway 없이 실제 컨트롤러를 호출하기 위해서다 — E2E 를 위해 운영 코드에
  # 새 진입점이나 스위치를 만들지 않는다(N16). 대가는 SIGNED_ONLY 미검증(계획 §9-5).
  APP_INTERNAL_TOKEN_MODE: DUAL_ACCEPT
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError"
  # local 프로파일은 **디버깅 전용**으로 show-sql·format_sql·DEBUG 로깅을 켠다. E2E 는 그
  # 프로파일을 연결 정보 때문에 빌려 쓸 뿐이므로 디버그 표면은 되돌린다 — 4서비스가 모든
  # 쿼리를 여러 줄로 stdout 에 쏟으면 docker json-file 로깅과 JVM 이 함께 느려진다.
  # (실측: 시나리오 연속 실행에서 `order.created` 소비가 3분 38초 밀렸다 — 계획 P19)
  SPRING_JPA_SHOW_SQL: "false"
  SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "false"
  LOGGING_LEVEL_COM_PEEKCART: INFO
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: INFO

x-app-common: &app-common
  networks: [internal]
  restart: "no"
  depends_on:
    mysql: {condition: service_healthy}
    redis: {condition: service_healthy}
    kafka: {condition: service_healthy}
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
    interval: 5s
    timeout: 3s
    # 4 JVM 이 동시에 뜨면서 CPU 를 두고 경합한다 — 실측 기동이 220s 창을 넘겼다.
    # 여유를 주되 상한은 유지한다(계획 P19: 무한 대기 금지). 60 + 5×60 = 360s.
    retries: 40
    start_period: 40s
  # 예산 (계획 P19) — 앱 하나가 러너 메모리를 다 먹으면 다른 앱이 OOM 으로 죽고
  # 그게 "시나리오 실패" 로 보인다. 원인을 분리하려면 상한이 필요하다.
  mem_limit: 1g

services:
  mysql:
    image: mysql:8.0.46
    networks: [internal]
    environment:
      MYSQL_ROOT_PASSWORD: root
      # P4 — init 단계에서 이 값이 marker 로 심긴다. readiness 가 현재 run_id 와 대조한다.
      # 기본값을 둔다 — `docker compose ... down` 같은 정리 명령까지 변수를 요구하면
      # runbook 의 정리 절차가 실패한다(실측: 잔여 스택을 못 내려 이후 실행과 자원을 다퉜다).
      # "지정 필수" 강제는 wrapper 가 한다 — 거기서만 cold start 판정에 쓰이기 때문이다.
      E2E_RUN_ID: ${E2E_RUN_ID:-unset}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/e2e/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    mem_limit: 1g

  redis:
    image: redis:7.2
    networks: [internal]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m

  kafka:
    image: apache/kafka:3.8.1
    networks: [internal]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # EXTERNAL 리스너 없음 — 호스트로 나가는 표면을 두지 않는다(격리 계약 2).
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # 자동 생성 토픽을 **1 파티션**으로 고정한다. 기본값 3 이면 브로커 1대에
      # 토픽 20 × 3 파티션 × consumer group 28 의 메타데이터/리밸런스 부하가 걸려
      # 소비가 수 분 단위로 지연된다(실측: product.updated 소비가 3분 지연).
      # saga 이벤트는 aggregate 키 기준 순서가 필요해 단일 파티션이 의미상으로도 맞다.
      KAFKA_NUM_PARTITIONS: 1
      CLUSTER_ID: peekcart-e2e-cluster-001
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 15s
    mem_limit: 1g

  pg-stub:
    image: python:3.12-alpine
    networks: [internal]
    working_dir: /app
    command: ["python3", "stub.py"]
    volumes:
      - ./scripts/e2e/pg-stub:/app:ro
    environment:
      PG_STUB_PORT: "8080"
      PG_STUB_AMOUNT: "10000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8080/__health',timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 128m

  order-service:
    <<: *app-common
    image: order-service:${PEEKCART_IMAGE_TAG:-ci}
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/peekcart_order?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: peekcart_order
      SPRING_DATASOURCE_PASSWORD: peekcart_order

  product-service:
    <<: *app-common
    image: product-service:${PEEKCART_IMAGE_TAG:-ci}
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/peekcart_product?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: peekcart_product
      SPRING_DATASOURCE_PASSWORD: peekcart_product

  payment-service:
    <<: *app-common
    image: payment-service:${PEEKCART_IMAGE_TAG:-ci}
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      pg-stub: {condition: service_healthy}
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/peekcart_payment?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: peekcart_payment
      SPRING_DATASOURCE_PASSWORD: peekcart_payment
      # PG 표면은 끄지 않는다 — 환불 체인 전구간(dispatcher→PG→회신→종결)이 시나리오 C 의
      # 대상이기 때문이다. 대신 stub 으로 향하게 하고 네트워크로 외부를 막는다.
      # 프로퍼티 이름 자체를 환경변수로 덮는다(relaxed binding). TOSS_BASE_URL 은 base yml 의
      # placeholder 기본값만 채우므로 application-local.yml 의 리터럴을 이기지 못한다 —
      # 실측: 그 상태로 dispatcher 가 api.tosspayments.com 을 호출했다(그리고 internal:true 가
      # UnknownHostException 으로 막았다. 격리가 없었으면 실 PG 로 나갔을 것이다).
      TOSS_PAYMENTS_BASE_URL: http://pg-stub:8080/v1
      TOSS_SECRET_KEY: e2e_sk_stub
      # dispatcher 주기만 줄인다. 환불 체인이 시나리오 상한 안에 끝나야 하기 때문이다.
      # reconcile 은 건드리지 않는다 — lockAtLeastFor=PT30S 라 5초를 줘도 실제 발화 주기가
      # 그렇게 되지 않아 값이 거짓말을 한다(diff 리뷰 #8). 주기 override 의 계약화는 P19.
      APP_REFUND_DISPATCH_INTERVAL_MS: "2000"

  notification-service:
    <<: *app-common
    image: notification-service:${PEEKCART_IMAGE_TAG:-ci}
    environment:
      <<: *app-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/peekcart_notification?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: peekcart_notification
      SPRING_DATASOURCE_PASSWORD: peekcart_notification

  # 시나리오 실행자. internal 네트워크 안에서 돌아야 DB·Kafka·앱에 닿는다 —
  # 호스트에서 실행하면 격리 계약 2 를 깨야 하므로 러너를 안으로 넣는다.
  runner:
    image: peekcart-e2e-runner:${PEEKCART_IMAGE_TAG:-ci}
    build:
      context: ./scripts/e2e/runner
    networks: [internal]
    profiles: [tools]
    working_dir: /work
    volumes:
      - ./scripts/e2e:/work/e2e:ro
      - ./.cache/e2e:/work/out
    environment:
      E2E_RUN_ID: ${E2E_RUN_ID}
      E2E_COMMIT_SHA: ${E2E_COMMIT_SHA:-unknown}
    entrypoint: ["/bin/bash"]
    mem_limit: 512m

  # egress 차단의 **양성 대조군** (계획 P16 ⑥). internal 이 아닌 기본 네트워크에 붙는다 —
  # 같은 canary 주소에 이쪽은 닿고 앱 쪽은 못 닿아야 "격리가 실제로 걸렸다" 가 성립한다.
  # 실패만 보면 canary 가 죽어도 통과한다.
  egress-control:
    image: peekcart-e2e-runner:${PEEKCART_IMAGE_TAG:-ci}
    networks: [external-control]
    profiles: [control]
    entrypoint: ["/bin/bash"]
    mem_limit: 128m

  # egress 대조군의 **표적**. 호스트에 TCP 서버를 띄우는 방식은 이식성이 없다 — Docker Desktop
  # 에서 브리지 게이트웨이는 VM 안 주소라 macOS 호스트 프로세스에 닿지 않는다(실측: 양성
  # 대조가 rc=7 로 실패했다). 표적을 컨테이너로 두면 양·음 프로브가 **같은 주소**를 겨누고
  # 어느 환경에서도 같게 동작한다.
  egress-canary:
    image: peekcart-e2e-runner:${PEEKCART_IMAGE_TAG:-ci}
    networks: [external-control]
    profiles: [control]
    entrypoint: ["python3", "-m", "http.server", "8080"]
    mem_limit: 128m

networks:
  internal:
    internal: true
  external-control:
    internal: false

volumes:
  mysql-data:
  redis-data:
  kafka-data:
