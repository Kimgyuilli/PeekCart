spring:
  datasource:
    url: jdbc:mysql://mysql:3306/peekcart_user?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:peekcart_user}
    password: ${DB_PASSWORD:peekcart_user}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: redis
      port: 6379

app:
  jwt:
    rs256:
      # 사용자 access token 서명 개인키의 **위치** (ADR-0013 D2). Secret Manager CSI 로 마운트한다
      # (k8s/base/services/user-service/secretproviderclass.yml). 값이 아니라 경로만 설정에 둔다.
      # env override seam 유지 — 하드코딩하면 base 의 ${JWT_PRIVATE_KEY_LOCATION:...} 치환이
      # 프로파일에 덮여 컨테이너 스모크(CSI 없음)가 부팅 단계에서 죽는다.
      private-key-location: ${JWT_PRIVATE_KEY_LOCATION:file:/etc/peekcart/user-keys/jwt-private.pem}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    com.peekcart: INFO
