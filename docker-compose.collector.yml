# Narrow overlay for existing e2e infrastructure; no app or PG service is started.
services:
  mysql:
    labels:
      peekcart.collector.nonce: ${COLLECTOR_NONCE:?}
  kafka:
    labels:
      peekcart.collector.nonce: ${COLLECTOR_NONCE:?}
    # 리스너는 덮어쓰지 않는다 — e2e·k8s 와 같은 29092 여야 preflight 의 실제 포트를 검증한다(D-106 ⑨).
    environment:
      CLUSTER_ID: ${COLLECTOR_CLUSTER_ID:?}
networks:
  internal:
    labels:
      peekcart.collector.nonce: ${COLLECTOR_NONCE:?}
  external-control:
    internal: true
    labels:
      peekcart.collector.nonce: ${COLLECTOR_NONCE:?}
volumes:
  mysql-data:
    labels:
      peekcart.collector.nonce: ${COLLECTOR_NONCE:?}
  redis-data:
    labels:
      peekcart.collector.nonce: ${COLLECTOR_NONCE:?}
  kafka-data:
    labels:
      peekcart.collector.nonce: ${COLLECTOR_NONCE:?}
