// product-service — Product peel (ADR-0011 §D1 · ADR-0014 · ADR-0010 F2 · ADR-0012)
// bootJar 산출 + 독립 부팅. 공통은 :common / :peekcart-common-observability / :peekcart-common-auth 에서만 가져온다.
// 서비스↔서비스 project() 의존 금지 (assertNoServiceProjectDeps 로 강제).
// Product = 첫 *발행* 서비스 peel — outbox 실행 세트 + idempotency + ShedLockConfig 를 자체 복제(notification 은 consume-only 라 idempotency 만 복제).
// 공유 DB 전환기: root·product 두 poller 가 같은 outbox_events 를 보므로 aggregateType allowlist + ShedLock 이름으로 소유권 분리(app yml).

plugins {
    id 'java'
    id 'org.springframework.boot'
}

bootJar {
    archiveFileName = 'product-service.jar'
}

jar {
    enabled = false
}

dependencies {
    // 멀티모듈 (ADR-0011 §D3 allowlist · ADR-0014)
    implementation project(':common')                        // web/jpa/kafka(api) + entity/response/exception/SlackPort/DistributedLockManager
    implementation project(':peekcart-common-observability') // actuator/micrometer-core(api) + MetricsConfig(S1)/ActuatorSecurityConfig(S4)
    implementation project(':peekcart-common-auth')          // security(api) + JWT 검증 primitives(JwtFilter/verify/LoginUser)

    // Bean Validation — @Valid 요청 검증 (web starter 는 Boot 3 에서 validation 미포함, B6 선례)
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Cache — @EnableCaching/@Cacheable(product/products) RedisCacheManager (CacheConfig 이관)
    implementation 'org.springframework.boot:spring-boot-starter-cache'

    // Redis — @Cacheable RedisCacheManager + blacklist read adapter(common-auth) 런타임
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // ShedLock — 자체 outbox poller(@SchedulerLock) + ShedLockConfig 복제 (첫 발행 서비스 peel)
    implementation 'net.javacrumbs.shedlock:shedlock-spring:6.3.1'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:6.3.1'

    // Micrometer Prometheus registry (observability 는 micrometer-core 만 api 노출)
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // Structured Logging (logback-spring.xml)
    implementation 'net.logstash.logback:logstash-logback-encoder:8.0'

    // MySQL
    runtimeOnly 'com.mysql:mysql-connector-j'

    // Flyway — 런타임 disabled(서비스), 공유 V1~V9 는 root flywayMigrateShared / 테스트 fixture 에서 적용
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'

    // JWT 검증 런타임 (common-auth 의 jjwt-impl/jackson 은 runtimeOnly → 비전이). Product 는 발급 아님 → jjwt-api 컴파일 불요.
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Swagger (common-auth OpenApiConfig 의 springdoc 은 implementation → 비전이)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation testFixtures(project(':common'))
    // Gateway 서명 내부 토큰 fixture — 보안 통합 테스트가 유효/위조 토큰을 만든다(ADR-0017)
    testImplementation testFixtures(project(':internal-token-contract'))

    // Testcontainers (MySQL/Redis/Kafka 통합)
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
    testImplementation 'org.testcontainers:kafka'
    // Redis 장애 주입(연결 거부 / 무응답) — L-006 fallback 검증. 테스트 전용, 운영 이미지 미포함
    testImplementation 'org.testcontainers:toxiproxy'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.awaitility:awaitility'
}

// D-035: 컨테이너를 모듈 싱글톤으로 공유하므로(ADR-0028) order-service 와 같은 규약을 건다.
// 자율 writer(스케줄러 · @KafkaListener)는 테스트에서 기본 off 다(ADR-0029). 리스너 소비나
// 타이머 발화를 검증하는 테스트만 @TestPropertySource 로 켠다.
// 클래스 순서는 매 실행 섞는다 — 공유 DB/Redis/브로커 상태 누수는 순서를 바꿔야 드러난다.
// 재현: ./gradlew :product-service:test -PtestSeed=<시드>
def productTestSeed = (project.findProperty('testSeed')
        ?: System.getenv('TEST_SEED')
        ?: System.currentTimeMillis()).toString()

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
    systemProperty 'app.scheduling.enabled', 'false'
    systemProperty 'app.kafka.listener.enabled', 'false'
    systemProperty 'junit.jupiter.testclass.order.default', 'org.junit.jupiter.api.ClassOrderer$Random'
    systemProperty 'junit.jupiter.execution.order.random.seed', productTestSeed
    doFirst {
        logger.lifecycle("[D-035] test class order seed = ${productTestSeed} " +
                "(재현: ./gradlew :product-service:test -PtestSeed=${productTestSeed})")
    }
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
    afterEvaluate {
        classDirectories = files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                '**/dto/**',
                '**/request/**',
                '**/response/**',
                '**/config/**',
                '**/ProductApplication*'
            ])
        })
    }
}
