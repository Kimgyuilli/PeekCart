spring:
  application:
    name: product-service
  profiles:
    active: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    # DB-per-service (구현 ② PR2): 자기 스키마(peekcart_product)에 자기 모듈 마이그레이션만 적용.
    enabled: true
    locations: classpath:db/migration
  kafka:
    # ADR-0020 D4-1 — NewTopic 선언만으로는 **기존** 토픽 config 가 바뀌지 않는다
    # (KafkaAdmin.modifyTopicConfigs 기본값 false). 동작 규약이라 base 소유(ADR-0007).
    admin:
      modify-topic-configs: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    listener:
      ack-mode: record
  data:
    # Redis 타임아웃은 '동작 규약'이므로 base 소유 (ADR-0007). host/port 는 프로파일 소유.
    # 유계 타임아웃이 없으면 fail-open 이 무의미하다 — Redis 가 죽지 않고 '매달리면'
    # Lettuce 기본 60s 를 다 기다린 뒤에야 CacheErrorHandler 가 불린다 (L-006, 구현 ⑤).
    # 500ms 인 이유: @Cacheable 한 요청이 get 실패 → DB → put 실패로 timeout 을 2회 소비한다.
    # 1s 로 두면 무응답 시 요청당 최소 2s 다.
    redis:
      timeout: 500ms
      connect-timeout: 300ms
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        # deadletter: DLQ 원장 backlog 조회 (구현 ④-c-2a P10). 메트릭 계약(④-d) 전까지 유일한 조회 표면.
        include: health,prometheus,deadletter
  metrics:
    tags:
      application: product-service

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

app:
  # Gateway 서명 내부 토큰 검증 (ADR-0017 D3 · 구현 ③ PR3d).
  # 공개키는 비밀이 아니므로 이미지에 베이크한다(운영 kid 교체는 k8s ConfigMap — PR3d-b).
  # [중요] gateway kid 를 app.jwt.rs256.public-keys 에 넣지 않는다 — User JWKS 가 레지스트리를 전량
  # 게시하므로 내부 신뢰 앵커가 외부에 노출된다(ADR-0017 D3, internal-key-ownership-lint 로 강제).
  internal-token:
    mode: SIGNED_ONLY
    public-keys:
      - kid: peekcart-gateway-dev-2026
        location: classpath:keys/dev-gateway-internal-public.pem
  # 재고 예약 lease (계획 ④-a P4 · ADR-0012 D3) — 동작 정책이므로 base 소유(ADR-0007).
  # 회수 순서 불변식: Order 취소(ttl 시점) → Product sweeper(ttl + sweeper-grace). 역전되면 oversell.
  # 예약 lease sweeper 의 주기·lock 정책 (계획 P17 · ADR-0007 — 동작 정책이므로 base 소유).
  # 회수 '대상' 판정은 app.reservation.lease 소관이고 여기는 '언제 도는가' 만 다룬다.
  scheduler:
    stock:
      lease-sweep-delay: 60s
      lock-at-most-for: 10m
      lock-at-least-for: 30s
  reservation:
    lease:
      ttl: 30m
      sweeper-grace: 5m      # 결제 승인 수락 ~ 예약 확정 반영의 in-flight 구간보다 커야 한다
      sweeper-batch-size: 200
  # processed_events 멱등성 보존 정책 (ADR-0012 D5 · 구현 ② PR3) — 동작 정책이므로 base 소유(ADR-0007).
  idempotency:
    retention: 9d          # floor 4창 max(7d) 이상 + ADR-0020 D4-3 replay 안전여유(dlq-replay-window 7d + clock-skew 5m + cleanup-safety 1d = 8d 5m) 이상 — 미만이면 부팅 실패
    # ADR-0020 D4-3 — 등호 허용(7d==7d)은 창 끝을 보장하지 못한다. 여유를 설정으로 강제한다.
    clock-skew-budget: 5m       # 서비스 간 시계 오차 (processed_at 이 각 서비스 로컬 시각)
    cleanup-safety-budget: 1d   # 정리 잡이 일 1회라 삭제가 최대 1일 늦는다
    floor:
      kafka-topic-retention: 7d
      max-consumer-downtime: 24h
      dlq-replay-window: 7d
      backfill-replay-window: 7d
    cleanup:
      batch-size: 500
      max-batches-per-run: 20
  outbox:
    retention: 7d          # PUBLISHED outbox_events 보존기간 (구현 ② PR3)
    # 공유 DB 전환기 poller 소유권 분리 (Product peel): product 는 PRODUCT 이벤트만 발행.
    lock-name: productOutboxPollingJob
    polling:
      batch-size: 100
      max-retry: 5
      publish-timeout: 6s
      cycle-timeout: 4m

# Slack: product 는 DLQ·에러 알림에 SlackPort 를 생성자 주입하나 발송은 비핵심.
# webhook 미설정 + no-op fallback 으로 부팅 보장 (PR3b GP-2 loop3 — presence-based
# @ConditionalOnProperty(slack.webhook.url) 가 placeholder 기본값에 항상 매치되던 문제 제거).
  # DLQ 원장 운영 계약 (구현 ④-c-2a P5) — 동작 정책이므로 base 소유(ADR-0007).
  dead-letter:
    cluster-id: peekcart-local
    # 토픽별 프로비저닝 세대. 토픽을 삭제·재생성하면 배포 전에 값을 올린다.
    # 미등록 토픽을 참조하면 부팅이 아니라 적재 시점에 예외 — 기본값 암묵 허용 금지(§2.5).
    # 키는 원본 토픽 이름이다. origin 헤더 판독 실패 행(DLQ_ORIGIN)은 좌표로 '<topic>.dlq' 를 싣지만,
    # .dlq 는 원본과 함께 선언·재생성되므로 원본의 세대를 따른다(정확 일치 우선 → 없으면 .dlq 제거 후 재조회).
    topic-generations:
      order.created: 1
      order.cancelled: 1
      payment.completed: 1
      payment.failed: 1
      payment.refunded: 1
      product.updated: 1
      stock.reservation.result: 1
      stock.compensation.requested: 1
    alert:
      stale-after: 24h     # 이 시간을 넘긴 미결은 경보 대상
      backlog-threshold: 50
      cooldown: 6h         # 같은 경보 재발송 억제 — 없으면 스케줄 주기마다 도배된다
      scan-limit: 100
    payload:
      max-length: 8000     # 초과분은 잘리고 payload_truncated 로 표시
    # replay 개시 kill-switch (④-c-2b-4a P21). **기본값 false 가 계약이다** — 배포 순간 진입점이
    # 열리면 backfill·증적·리허설 이전에 replay 가 가능해지고, 닫는 데 롤링 재기동이 또 든다.
    # drain·롤백 계약(④-c-2b-4b)이 서기 전까지 운영에서 열지 않는다. 동작 정책이므로 base 소유(ADR-0007).
    replay:
      enabled: false
    purge:
      retention: 90d       # DISCARDED 후 보존기간. OPEN/ACKED 는 삭제 대상이 아니다
      batch-size: 500
      max-batches-per-run: 20

slack:
  noop-fallback:
    enabled: true
