name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── lint: 정책 검사. Java/Gradle 불요라 테스트와 병렬로 즉시 시작한다 ──────────────
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4


      - name: Install lint dependencies
        run: |
          python3 -m pip install --user pyyaml

      - name: Set up kubectl (for ServiceMonitor lint)
        uses: azure/setup-kubectl@v4

      - name: Install promtool (for PromQL syntax lint)
        # PR3c: observability-promql-lint 의 PromQL syntax 검증 정본(ADR-0015 D5-V6).
        # promtool 미설치 시 lint 가 exit 2 로 명확히 실패한다 — balance 검사로 대체 금지.
        run: |
          PROM_VERSION=3.12.0
          curl -fsSL -o /tmp/prometheus.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz"
          tar -xzf /tmp/prometheus.tar.gz -C /tmp
          sudo install "/tmp/prometheus-${PROM_VERSION}.linux-amd64/promtool" /usr/local/bin/promtool
          promtool --version

      - name: Run CI policy lints
        # PR3b: per-service k8s 매니페스트(5) 완성으로 IMAGE_CONTRACT_TRANSITION(SUSPENDED) 제거.
        # image-contract-lint 가 ci↔base↔gke 3-way 를 full 5/5 로 강제한다.
        # PR3c: observability-ssot/promql lint 재활성 — root 단일 yml 전제를 per-service ground truth
        # (5서비스 application.yml + k8s Service metadata.name)로 재작성 완료(ADR-0015).
        #
        # 구현 ③ PR3b: gateway base/gke 매니페스트 완성으로 IMAGE_CONTRACT_TRANSITION 제거 —
        # image-contract-lint 가 도메인 5 + 인프라 1 을 full 6/6 로 강제한다(PR3a 가 남긴 꼬리 종결).
        # gateway-exposure-lint: 렌더 산출에서 gateway 노출 계약(8080 단일·관리포트 미노출·ConfigMap 배선)
        # 을 검사한다 — kustomize 렌더는 이 위반들을 전부 성공으로 통과시킨다.
        # 구현 ③ PR3d-b: 비밀 계약이 "Secret 미주입(비밀 0)" → "승인된 CSI 마운트 정확히 1개" 로 바뀌었다
        # (gateway 가 내부 토큰 서명 개인키를 갖게 됨, ADR-0017 D2). k8s Secret 경유는 여전히 금지다.
        run: |
          bash scripts/kustomize-namespace-lint.sh
          # D-043: gate 는 lint/test/guards/images/e2e 전체의 최종 판정자다.
          bash scripts/ci-release-gate-lint.sh
          bash scripts/ci-release-gate-lint.sh --self-test
          bash scripts/ci-image-identity.sh --self-test
          # D-033: 시나리오와 음성 대조군을 병렬로 돌리되 PR 에서 둘 다 필수로 유지한다.
          bash scripts/ci-e2e-parallel-lint.sh
          bash scripts/ci-e2e-parallel-lint.sh --self-test
          # D-032: 통합 테스트가 컨테이너를 직접 선언하지 못하게 한다(ADR-0028).
          # 규약을 코드로 강제하지 않으면 새 테스트가 관행대로 @Container 를 선언하고,
          # 그 클래스만 조용히 컨테이너를 다시 띄운다 — CI 는 초록이고 테스트 시간만 우상향한다.
          # 실측으로 그 비용이 클래스당 약 31초였다.
          bash scripts/integration-test-container-lint.sh
          bash scripts/integration-test-container-lint.sh --self-test
          bash scripts/image-contract-lint.sh
          bash scripts/gateway-exposure-lint.sh
          # 조작 입력 29종에서 실제로 실패하는지 — lint 자체가 vacuous-green 으로 썩는 것을 막는다.
          # PR4: gateway-metrics(관리 포트 scrape Service) 삭제·포트 오지정·LB 승격·selector 드리프트 포함.
          bash scripts/gateway-exposure-lint.sh --self-test
          # HPA 가 소유하는 replicas 를 매니페스트가 다시 뺏지 않는지(구현 ③ PR3d-b-2 클러스터 세션).
          # base 에 replicas 가 남아 있으면 apply 마다 HPA 가 올려둔 수가 깎여 가용 Pod 가
          # minReplicas 아래로 떨어진다 — 렌더는 이걸 전부 통과시키고, 주석으로도 막히지 않았다.
          bash scripts/hpa-replicas-ownership-lint.sh
          bash scripts/hpa-replicas-ownership-lint.sh --self-test
          # NetworkPolicy backend ingress 제한(PR3c) — 0개 선택·peer 누락·egress 혼입 차단.
          bash scripts/networkpolicy-contract-lint.sh
          bash scripts/networkpolicy-contract-lint.sh --self-test
          # 내부 토큰 키 도메인 분리(ADR-0017 D3) — Gateway 공개키가 User JWKS 설정에 섞이면 실패.
          # kid 가 아니라 SPKI fingerprint 로 비교해 "같은 키를 다른 kid 로" 우회를 막는다.
          bash scripts/internal-key-ownership-lint.sh
          bash scripts/internal-key-ownership-lint.sh --self-test
          # 개인키 소유 경계(ADR-0013 D2 · ADR-0017 D2) — 렌더된 **모든 Pod 생성 종류**에서
          # gateway/user 개인키가 서로의 워크로드나 제3의 Job/CronJob/DaemonSet/Pod 로 새지 않는지.
          # exposure-lint 가 gateway 한 워크로드의 표면을 보는 반면, 이건 반대로 "누가 그 키를
          # 가져갔나" 를 본다 — 검사 대상 집합이 다르다.
          bash scripts/workload-key-ownership-lint.sh
          bash scripts/workload-key-ownership-lint.sh --self-test
          # settings.gradle include ↔ Dockerfile COPY 정합 — 모듈 추가 시 COPY 누락으로
          # gradle 은 그린인데 이미지 빌드만 깨지는 실패를 build 잡에서 미리 잡는다(#80 회귀).
          bash scripts/dockerfile-module-sync-lint.sh
          bash scripts/dockerfile-module-sync-lint.sh --self-test
          # DLQ 원장은 DB-per-service 라 4개 DB 에 같은 테이블을 둔다(④-c-2a). 한 서비스에서만
          # 컬럼을 고치면 runbook 조회 절차가 그 서비스에서만 깨지고, 운영자가 그 DB 를 볼 때까지
          # 드러나지 않는다. UNIQUE 6컬럼과 식별자 NOT NULL 도 함께 강제한다 —
          # nullable 이면 MySQL UNIQUE 가 같은 poison record 를 여러 행으로 만든다.
          bash scripts/dead-letter-schema-parity-lint.sh
          bash scripts/dead-letter-schema-parity-lint.sh --self-test
          bash scripts/replay-entrypoint-lint.sh
          # drain 상한은 preflight 스크립트가 소유한다(ADR-0022 D2) — 그 대가로 backoff/clock-skew 와
          # 갈라질 수 있고, 갈라지면 drain 이 **조기 통과**한다. 드리프트 검사와 그 자기검증.
          bash scripts/replay-entrypoint-lint.sh --self-test
          # drain 판정 자체의 fixture 검증(계획 V-37). 수집은 클러스터가 필요하지만 판정은 순수 함수다.
          bash scripts/replay-drain-preflight.sh --self-test
          # 마이그레이션이 **부여되지 않은 권한**을 요구하면 실제 스택에서만 부팅이 깨진다 —
          # Testcontainers 는 root 로 돌아 그 차이를 보지 못한다(PR #105 에서 실제로 났다).
          bash scripts/migration-grant-lint.sh
          bash scripts/migration-grant-lint.sh --self-test
          # PG stub 이 본문을 실제로 읽는지 — 못 읽으면 confirm script 가 통째로
          # 죽은 채 e2e 가 통과한다(D-020 에서 실제로 그랬다). 30분 e2e 대신 여기서 잡는다.
          python3 scripts/e2e/pg-stub/stub.py --self-test
          bash scripts/servicemonitor-selector-lint.sh
          # PR4: 이 lint 는 음성 대조군이 없어 canonical 집합(6)을 넓히는 변경이 vacuous-green 이
          # 될 수 있었다 — SM 삭제/추가·selector 오타·endpoint port 오타·과대매칭 6종.
          bash scripts/servicemonitor-selector-lint.sh --self-test
          bash scripts/observability-ssot-lint.sh
          bash scripts/observability-promql-lint.sh
          # 구현 ④-d-1 P5 + PR4: alert 라벨/식 계약과 dashboard 변수 집합이 조작 입력에서
          # 실제로 실패하는지 17종 — alert 삭제·라벨 제거·집합 축소·메트릭 변조·entry 삭제·
          # 부정 matcher·0*우회, gateway 제외/scrape-absent 이름 변조, dashboard 드리프트 3종.
          bash scripts/observability-promql-lint.sh --self-test
          # PR3c sweep — 단일 'peekcart' 관측성 식별자(application/service) 잔존 0 강제.
          # escaped-quote(JSON/embedded-yaml) + 형제 라벨(service) 양쪽 매치(PLAN-BLINDSPOTS B11).
          # uid/tags 의 peekcart-* 브랜드 문자열은 라벨 값(="peekcart")이 아니므로 매치 대상 외.
          if grep -rnE '(application|service)=\\?"peekcart"|application: ?peekcart|service: ?peekcart' k8s/monitoring scripts; then
            echo "::error::단일 'peekcart' 관측성 라벨 값 잔존 — per-service 로 전환 필요 (ADR-0015)"
            exit 1
          fi


      # shard 커버리지 — settings.gradle 의 모듈이 test 매트릭스에 정확히 1회 나타나는가.
      # 누락되면 그 모듈 테스트가 조용히 사라지고, 중복되면 merge-multiple(last-writer-wins)이
      # 증적을 덮는다. dockerfile-module-sync-lint 와 같은 종류의 실패를 막는다.
      - name: CI test matrix coverage lint
        run: |
          bash scripts/ci-test-matrix-lint.sh
          bash scripts/ci-test-matrix-lint.sh --self-test

  # ── test: 모듈 shard 매트릭스. 분해 전 단일 build 는 32m23s 였다(run 33314020601) ──
  # shard→모듈 매핑의 **단일 정본은 matrix.include[].modules** 다. Gradle 명령과
  # ci-test-matrix-lint 가 같은 필드를 읽는다 — 실행식과 검증식이 갈리면 lint 가
  # 자기 복사본만 보는 false-green 이 된다.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # @Container 선언은 서비스에 몰려 있다(platform 0 / user 8 / notification 18 /
          # payment 36 / product 48 / order 55). platform 은 light 모듈을 묶어 러너 기동과
          # 공통 의존 컴파일 중복을 줄인다.
          - shard: platform
            modules: common peekcart-common-auth peekcart-common-observability internal-token-contract gateway
          - shard: user-service
            modules: user-service
          - shard: notification-service
            modules: notification-service
          - shard: payment-service
            modules: payment-service
          - shard: product-service
            modules: product-service
          - shard: order-service
            modules: order-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - run: chmod +x gradlew

      # :module:build = assemble + check. test 만 돌리면 bootJar/jar 검증을 잃는다.
      # 실패하면 **그대로 실패시킨다** — job 의 red 가 "이 shard 가 깨졌다" 는 신호다.
      # 종료코드를 스텝 간에 나르지 않는다(단일 Gradle 호출에 모듈별 rc 는 존재하지 않는다).
      - name: Build & test shard
        env:
          SPRING_PROFILES_ACTIVE: test
        run: |
          TASKS=""
          for m in ${{ matrix.modules }}; do TASKS="$TASKS :${m}:build"; done
          echo "shard=${{ matrix.shard }} tasks=$TASKS"
          ./gradlew $TASKS --no-daemon --console=plain

      # upload-artifact 는 매치된 파일의 **최소 공통 조상** 기준 상대 경로로 저장한다.
      # `<module>/build/test-results/**` 를 그대로 올리면 그 조상 아래만 남아 gate 에서
      # 배치가 복원되지 않는다. staging 을 조상으로 만들어야 `<module>/build/...` 가 보존된다.
      - name: Stage results
        if: ${{ !cancelled() }}
        run: |
          for m in ${{ matrix.modules }}; do
            for d in test-results reports; do
              [ -d "${m}/build/${d}" ] || continue   # 무테스트 모듈은 산출물이 없다(정상)
              mkdir -p "staging/${m}/build"
              cp -R "${m}/build/${d}" "staging/${m}/build/${d}"
            done
          done
          find staging -type f | head -5 || true

      # 이름에 run_attempt 를 넣지 않는다 — "Re-run failed jobs" 는 실패 job 만 재실행하므로
      # 성공 shard 는 이전 attempt 이름으로 남는다. attempt 한정이면 gate 가 1개만 찾는다.
      # v4 artifact 는 immutable 이라 재실행 충돌은 overwrite 로 푼다.
      - name: Upload shard results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: shard-results-${{ matrix.shard }}
          path: staging/**
          overwrite: true
          if-no-files-found: error

  # ── guards: 루트 프로젝트의 check 에 걸린 가드 5종 ────────────────────────────────
  # `./gradlew check` 는 전 모듈 check 를 다시 돌린다. 루트 `:build` 로 한정한다.
  # 다만 가드가 전 서비스 :classes 를 dependsOn 하므로 이 job 은 전 배포 모듈의
  # **main 컴파일을 수행**한다(test 제외) — shard 들과 중복이다.
  guards:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - run: chmod +x gradlew

      # tee 가 필수다 — 이전 스텝의 콘솔 출력은 다음 셸에서 파일로 읽을 수 없다.
      - name: Root build (guards)
        run: |
          set -o pipefail
          ./gradlew :build --no-daemon --console=plain 2>&1 | tee "$RUNNER_TEMP/guards.log"

      # 가드가 UP-TO-DATE 로 건너뛰면 "도는 것처럼 보이지만 안 도는" 상태가 된다.
      # 패턴 판정은 lint 로 위임한다 — 가드 출력은 "assertX: <내용> OK (설명)" 형태라
      # 콜론 바로 뒤에 OK 가 오지 않는 것이 있고(build.gradle:96 은 모듈 목록을 낀다),
      # self-test 가 실제 5종 출력으로 그 패턴을 고정한다.
      - name: Assert guards actually ran
        if: ${{ !cancelled() }}
        run: bash scripts/ci-test-matrix-lint.sh --verify-guards "$RUNNER_TEMP/guards.log"

      # 루트는 소스 없는 aggregator 라 build/reports 생성이 보장되지 않는다(bootJar/jar 비활성).
      # report 를 필수로 걸면 깨끗한 실행에서도 upload 가 실패해 guards→gate→images 가
      # false-red 가 된다. 항상 생기는 guards.log 를 함께 담아 **artifact 존재만** 보장하고,
      # report 자체는 있으면 보존한다(ADR-0011 §D4).
      - name: Stage root evidence
        if: ${{ !cancelled() }}
        run: |
          mkdir -p root-staging/build
          cp "$RUNNER_TEMP/guards.log" root-staging/guards.log 2>/dev/null || \
            echo "guards.log 부재" > root-staging/guards.log
          # build/ 경로 성분을 보존해야 ADR-0011 §D4 의 `**/build/reports/` 계약이 유지된다.
          [ -d build/reports ] && cp -R build/reports root-staging/build/reports || true
          find root-staging -type f | head -5

      - name: Upload root evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: root-reports
          path: root-staging/**
          overwrite: true
          if-no-files-found: error

  # ── gate: 전체 필수 검증 + saga 계약 증적 통합 ─────────────────────────────────
  # test/guards 는 JVM 증적 소비, 나머지는 PR 병합·이미지 승격의 필수 판정이다.
  gate:
    needs: [lint, test, guards, images, e2e]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install lint dependencies
        if: ${{ !cancelled() }}
        run: python3 -m pip install --user pyyaml

      # merge-multiple 을 쓰지 않는다 — 같은 상대 경로에서 last-writer-wins 라 한 모듈이
      # 두 shard 에 들어가면 증적이 조용히 덮인다(P6 이 정적으로 막지만, 업로드 이후의
      # 충돌·변조는 못 본다). artifact 별로 받아 충돌을 먼저 검출하고 병합한다.
      - name: Download shard results
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@v4
        with:
          pattern: shard-results-*
          path: _artifacts

      # 충돌 0 을 확인한 뒤 `<module>/build/...` 배치로 병합한다. 이 배치라야 saga lint 의
      # 기본 glob(./*/build/test-results/test)이 로컬과 같게 동작한다.
      - name: Merge shard artifacts (collision-checked)
        if: ${{ !cancelled() }}
        run: bash scripts/ci-test-matrix-lint.sh --merge-artifacts _artifacts

      - name: Download root reports
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@v4
        with:
          name: root-reports
          path: root-evidence

      # 4-a. 기대 목록은 관측이 아니라 **정적 매핑**에서 온다 — 관측값 0 을 기록하면
      # "정상 무테스트" 와 "테스트 소실" 이 같아진다. 이 검사가 실패하면 아래 증적 대조의
      # "증적 없음" 과 **다른 메시지**로 끝난다(원인 오진 방지).
      - name: Verify artifact layout
        id: layout
        if: ${{ !cancelled() }}
        run: bash scripts/ci-test-matrix-lint.sh --verify-layout

      # 4-b. 배치가 온전할 때만 전체 증적 대조. 배치가 깨졌으면 결측 22행을 대량 출력하지 않는다.
      - name: saga contract matrix — jvm evidence
        if: ${{ !cancelled() && steps.layout.outcome == 'success' && needs.test.result == 'success' }}
        run: |
          SAGA_COMMIT_SHA="${GITHUB_SHA}" bash scripts/saga-contract-matrix-lint.sh --jvm-evidence

      # shard 결과와 무관한 계약들 — 배치가 깨져도 항상 돈다.
      - name: Contract self-tests (stack-independent)
        if: ${{ !cancelled() }}
        run: |
          bash scripts/saga-contract-matrix-lint.sh --structure
          bash scripts/saga-contract-matrix-lint.sh --self-test
          bash scripts/saga-e2e-smoke.sh --self-test
          bash scripts/e2e-network-contract-lint.sh --self-test
          bash scripts/kafka-subscription-contract-lint.sh --self-test

      # ADR-0011 §D4 — CI test-report artifact path 를 **/build/reports/ 로 일반화.
      # 모듈 test-results · 모듈 reports · 루트 reports 세 트리를 모두 담는다.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-reports
          path: |
            root-evidence/**
            */build/test-results/**
            */build/reports/**
          overwrite: true
          if-no-files-found: warn

      # !cancelled() 로 실패 후에도 진단을 모으므로 마지막에 모든 선행 결과를 전파한다.
      - name: Propagate upstream failure
        if: ${{ !cancelled() && (needs.lint.result != 'success' || needs.test.result != 'success' || needs.guards.result != 'success' || needs.images.result != 'success' || needs.e2e.result != 'success') }}
        run: |
          echo "::error::선행 job 실패 — lint=${{ needs.lint.result }} test=${{ needs.test.result }} guards=${{ needs.guards.result }} images=${{ needs.images.result }} e2e=${{ needs.e2e.result }}"
          exit 1

  # D-031: gate 를 needs 에서 뺀다 — 이미지 빌드는 테스트 결과와 무관한 일인데 전 샤드
  # 완료를 기다리고 있었다(실측 run 35731821466 에서 images 가 test 보다 18분 늦게 시작).
  # 최종 gate 가 images/e2e 까지 기다리므로 이미지 빌드의 테스트 병렬성은 유지한다.
  images:
    needs: [lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # 도메인 5서비스(ADR-0010 §5) + 인프라 게이트웨이 1 = 6 (구현 ③ PR3a).
        # 주의: image-contract-lint 의 matrix 추출은 연속된 '- item' 행만 읽는다 — 항목 사이에
        # 주석을 끼우면 그 뒤가 잘려 canonical 대조가 조용히 어긋난다.
        service:
          - notification-service
          - user-service
          - product-service
          - order-service
          - payment-service
          - gateway

    steps:
      - uses: actions/checkout@v4

      # D-031: buildx + GitHub Actions 레이어 캐시. 6개 이미지를 매 실행 밑바닥부터
      # 빌드하고 있었다(실측 run 35731821466 에서 최장 173초).
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          tags: ${{ matrix.service }}:ci
          # load 가 필수다 — docker-container 드라이버는 빌드 결과를 로컬 daemon 에
          # 남기지 않는다. 없으면 뒤따르는 health smoke(docker run)와 docker save 가
          # 이미지를 찾지 못한다.
          load: true
          # scope 를 서비스별로 나눈다. 매트릭스 6개가 단일 scope 를 공유하면 서로의
          # 캐시를 덮어써 마지막 하나만 남는다.
          cache-from: type=gha,scope=image-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.service }}

      - name: Health smoke
        run: bash scripts/docker-health-smoke.sh ${{ matrix.service }}:ci

      # push 는 publish 가 쓰고, PR 은 e2e 잡이 쓴다. **PR 에서도 saga 4개는 올려야 한다** —
      # 초안은 push 한정이라 PR 러너에 이미지가 하나도 없었다(④-d-1 계획 리뷰가 잡은 전제).
      # 두 조건을 한 식으로 합쳐 Save/Upload 가 어긋날 수 없게 한다.
      - name: Save image (publish 또는 e2e 소비용)
        if: github.event_name == 'push' || contains(fromJSON('["order-service","product-service","payment-service","notification-service"]'), matrix.service)
        run: |
          set -euo pipefail
          docker save ${{ matrix.service }}:ci | gzip > image.tar.gz
          bash scripts/ci-image-identity.sh record ${{ matrix.service }}:ci .

      - name: Upload image artifact
        if: github.event_name == 'push' || contains(fromJSON('["order-service","product-service","payment-service","notification-service"]'), matrix.service)
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.service }}
          path: |
            image.tar.gz
            image.tar.gz.sha256
            image-id.txt
          retention-days: 1
          # 조용한 빈 artifact 는 e2e 잡에서 '이미지 없음' 으로 뒤늦게 터진다.
          if-no-files-found: error

  # cross-service saga E2E (계획 P12·P16·P18·P19).
  # 시나리오 4종 + 음성 대조군을 별도 러너에서 병렬로 돌린다.
  # 두 매트릭스 항목 모두 PR 과 push 에서 필수이며 각자 cold start 스택을 소유한다.
  e2e:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        mode: [scenarios, negative-control]
    # ⑤ 실행 예산 — 전체 상한. 인프라가 매달려도 러너를 오래 잡지 않는다.
    timeout-minutes: 45
    env:
      PEEKCART_IMAGE_TAG: ci
      E2E_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.mode }}
      E2E_COMMIT_SHA: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Download saga service images
        uses: actions/download-artifact@v4
        with:
          pattern: image-*-service
          path: /tmp/images

      - name: Load images
        run: |
          set -euo pipefail
          # saga 4개가 **정확히** 있어야 한다. 하나라도 없으면 compose 가 옛 이미지를 쓰거나
          # pull 을 시도해 무엇을 검증했는지 알 수 없게 된다.
          expected="notification-service order-service payment-service product-service"
          for svc in $expected; do
            f="/tmp/images/image-${svc}/image.tar.gz"
            [[ -f "$f" ]] || { echo "::error::${svc} 이미지 artifact 가 없다"; exit 1; }
            bash scripts/ci-image-identity.sh load "${svc}:ci" "/tmp/images/image-${svc}"
          done
          loaded=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -c ':ci$' || true)
          echo "loaded ${loaded} images"
          for svc in $expected; do
            docker image inspect "${svc}:ci" >/dev/null \
              || { echo "::error::${svc}:ci 가 로드되지 않았다"; exit 1; }
          done

      - name: Build runner image
        run: docker compose -f docker-compose.e2e.yml -p e2e-${E2E_RUN_ID} build runner

      - name: 시나리오 4종
        if: matrix.mode == 'scenarios'
        run: bash scripts/saga-e2e-smoke.sh

      - name: 음성 대조군
        if: matrix.mode == 'negative-control'
        run: bash scripts/saga-e2e-smoke.sh --negative-control

      - name: saga contract matrix gate (structure + e2e evidence)
        if: matrix.mode == 'scenarios'
        run: |
          bash scripts/saga-contract-matrix-lint.sh --structure
          SAGA_COMMIT_SHA="${GITHUB_SHA}" \
            bash scripts/saga-contract-matrix-lint.sh --e2e-evidence ".cache/e2e/${E2E_RUN_ID}"

      # ③ 실패해도 증적은 남긴다 — 실패한 실행의 로그가 가장 필요하다.
      - name: 증적 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence-${{ github.run_id }}-${{ matrix.mode }}
          path: .cache/e2e/
          retention-days: 7

      - name: 스택 정리
        if: always()
        run: |
          docker compose -f docker-compose.e2e.yml -p "e2e-${E2E_RUN_ID}" \
            down -v --remove-orphans || true

  # GHCR publish — main push 한정. 최종 gate 뒤에 검증된 artifact 만 승격한다.
  # packages:write 는 이 job 에만 부여되어 PR build/smoke 경로엔 write 토큰이 닿지 않는다.
  publish:
    needs: [gate]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # 도메인 5서비스(ADR-0010 §5) + 인프라 게이트웨이 1 = 6 (구현 ③ PR3a).
        # 주의: image-contract-lint 의 matrix 추출은 연속된 '- item' 행만 읽는다 — 항목 사이에
        # 주석을 끼우면 그 뒤가 잘려 canonical 대조가 조용히 어긋난다.
        service:
          - notification-service
          - user-service
          - product-service
          - order-service
          - payment-service
          - gateway

    steps:
      - uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: image-${{ matrix.service }}

      - name: Load image
        run: bash scripts/ci-image-identity.sh load ${{ matrix.service }}:ci .

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image name
        id: img
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/peekcart-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          set -euo pipefail
          IMG="${{ steps.img.outputs.name }}"
          docker tag ${{ matrix.service }}:ci "$IMG:${{ github.sha }}"
          push_out="$(docker push "$IMG:${{ github.sha }}")"
          echo "$push_out"
          DIGEST="$(printf '%s\n' "$push_out" | sed -nE 's/^.*digest: (sha256:[0-9a-f]{64}).*$/\1/p' | tail -1)"
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::[L-016a] ${IMG} push digest 산출 실패 — D-016 image promotion 계약 위반" >&2
            exit 1
          fi
          bash scripts/ci-image-identity.sh verify-remote "$IMG" "$DIGEST" image-id.txt
          docker buildx imagetools create --prefer-index=false \
            --tag "$IMG:latest" --metadata-file "$RUNNER_TEMP/promotion.json" "$IMG@$DIGEST"
          promoted="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("containerimage.descriptor", {}).get("digest", ""))' "$RUNNER_TEMP/promotion.json")"
          if [[ "$promoted" != "$DIGEST" ]]; then
            echo "::error::latest digest 불일치: sha=$DIGEST latest=$promoted" >&2
            exit 1
          fi
          latest="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$IMG:latest" |
            python3 -c 'import json,sys; print(json.load(sys.stdin).get("digest", ""))')"
          if [[ "$latest" != "$DIGEST" ]]; then
            echo "::error::원격 latest digest 불일치: sha=$DIGEST latest=$latest" >&2
            exit 1
          fi
          echo "pushed: ${IMG}@${DIGEST} (tags: ${{ github.sha }}, latest)"
