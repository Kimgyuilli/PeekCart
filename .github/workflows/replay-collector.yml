name: Actual replay collector adapters

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/replay-drain-preflight.sh'
      - 'scripts/replay-drain-docker.py'
      - 'scripts/tests/replay-drain*'
      - 'docker-compose.collector.yml'
      - 'docker-compose.e2e.yml'
      - 'scripts/e2e/mysql-init/**'
      - '*-service/src/main/resources/db/migration/**'
      - '.github/workflows/replay-collector.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: replay-collector-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actual-adapters:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Existing shell and new ownership controls
        run: |
          set -euo pipefail
          bash scripts/replay-drain-preflight.sh --self-test
          python3 -B scripts/tests/replay-drain-docker-test.py
      - name: Actual MySQL and Kafka collector observations
        run: python3 -B scripts/replay-drain-docker.py run --evidence build/collector
      - name: Recover only this fixture's resources
        if: always()
        timeout-minutes: 2
        run: python3 -B scripts/replay-drain-docker.py cleanup --evidence build/collector
      - name: Actual evidence completeness and negative controls
        run: python3 -B scripts/tests/replay-drain-docker-test.py --evidence build/collector
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-collector-evidence
          path: build/collector/
          retention-days: 7
          if-no-files-found: error
