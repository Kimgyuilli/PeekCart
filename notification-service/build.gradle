// notification-service — 첫 서비스 peel (ADR-0011 §D1 · ADR-0014 · PR2a-2b)
// bootJar 산출 + 독립 부팅. 공통은 :common / :peekcart-common-observability / :peekcart-common-auth 에서만 가져온다.
// 서비스↔서비스 project() 의존 금지 (assertNoServiceProjectDeps 로 강제).

plugins {
    id 'java'
    id 'org.springframework.boot'
}

bootJar {
    archiveFileName = 'notification-service.jar'
}

jar {
    enabled = false
}

dependencies {
    // 멀티모듈 (ADR-0011 §D3 allowlist · ADR-0014)
    implementation project(':common')                       // web/jpa/kafka(api) + entity/response/exception/SlackPort
    implementation project(':peekcart-common-observability') // actuator/micrometer-core(api) + MetricsConfig(S1)/ActuatorSecurityConfig(S4)
    implementation project(':peekcart-common-auth')          // security(api) + JWT 검증 primitives(JwtFilter/verify/LoginUser)

    // Redis — blacklist read adapter(common-auth) 런타임 + 서비스 자체 사용
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // Bean Validation 런타임 — retention floor fail-fast(@Validated @ConfigurationProperties, 구현 ② PR3).
    // web validation 미사용이라 미보유였음 → 추가. 구현 ④-c-2b-2 P9 이후 outbox retention 도 같은 경로로 검증된다.
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // ShedLock — retention cleanup·DLQ 유지보수·outbox poller 의 @SchedulerLock + ShedLockConfig.
    // 구현 ② PR3(cleanup) 로 도입했고, 구현 ④-c-2b-2 P9 의 outbox poller/reconciler 가 같은 배선을 쓴다.
    implementation 'net.javacrumbs.shedlock:shedlock-spring:6.3.1'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:6.3.1'

    // Micrometer Prometheus registry (observability 는 micrometer-core 만 api 노출)
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // Structured Logging (logback-spring.xml)
    implementation 'net.logstash.logback:logstash-logback-encoder:8.0'

    // MySQL
    runtimeOnly 'com.mysql:mysql-connector-j'

    // Flyway — 런타임 disabled(서비스), 공유 V1~V4 는 root flywayMigrateShared / 테스트 fixture 에서 적용
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'

    // JWT 검증 런타임 (common-auth 의 jjwt-impl/jackson 은 runtimeOnly → 비전이)
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Swagger (common-auth OpenApiConfig 의 springdoc 은 implementation → 비전이)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation testFixtures(project(':common'))
    // Gateway 서명 내부 토큰 fixture — 보안 통합 테스트가 유효/위조 토큰을 만든다(ADR-0017)
    testImplementation testFixtures(project(':internal-token-contract'))

    // Testcontainers
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
    testImplementation 'org.testcontainers:kafka'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.awaitility:awaitility'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
    afterEvaluate {
        classDirectories = files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                '**/dto/**',
                '**/request/**',
                '**/response/**',
                '**/config/**',
                '**/NotificationApplication*'
            ])
        })
    }
}
