spring:
  application:
    name: notification-service
  profiles:
    active: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    # DB-per-service (구현 ② PR2): 자기 스키마(peekcart_notification)에 자기 모듈 마이그레이션만 적용.
    enabled: true
    locations: classpath:db/migration
  kafka:
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    listener:
      ack-mode: record
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        # deadletter: DLQ 원장 backlog 조회 (구현 ④-c-2a P10). 메트릭 계약(④-d) 전까지 유일한 조회 표면.
        include: health,prometheus,deadletter
  metrics:
    tags:
      application: notification-service

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

app:
  # Gateway 서명 내부 토큰 검증 (ADR-0017 D3 · 구현 ③ PR3d).
  # 공개키는 비밀이 아니므로 이미지에 베이크한다(운영 kid 교체는 k8s ConfigMap — PR3d-b).
  # [중요] gateway kid 를 app.jwt.rs256.public-keys 에 넣지 않는다 — User JWKS 가 레지스트리를 전량
  # 게시하므로 내부 신뢰 앵커가 외부에 노출된다(ADR-0017 D3, internal-key-ownership-lint 로 강제).
  internal-token:
    mode: SIGNED_ONLY
    public-keys:
      - kid: peekcart-gateway-dev-2026
        location: classpath:keys/dev-gateway-internal-public.pem
  # processed_events 멱등성 보존 정책 (ADR-0012 D5 · 구현 ② PR3) — 동작 정책이므로 base 소유(ADR-0007).
  idempotency:
    retention: 9d          # floor 4창 max(7d) 이상 + ADR-0020 D4-3 replay 안전여유(dlq-replay-window 7d + clock-skew 5m + cleanup-safety 1d = 8d 5m) 이상 — 미만이면 부팅 실패
    # ADR-0020 D4-3 — 등호 허용(7d==7d)은 창 끝을 보장하지 못한다. 여유를 설정으로 강제한다.
    clock-skew-budget: 5m       # 서비스 간 시계 오차 (processed_at 이 각 서비스 로컬 시각)
    cleanup-safety-budget: 1d   # 정리 잡이 일 1회라 삭제가 최대 1일 늦는다
    floor:
      kafka-topic-retention: 7d
      max-consumer-downtime: 24h
      dlq-replay-window: 7d
      backfill-replay-window: 7d
    cleanup:
      batch-size: 500
      max-batches-per-run: 20

  # outbox 발행 정책 (ADR-0020 D2 · 구현 ④-c-2b-2 P9) — 동작 정책이므로 base 소유(ADR-0007).
  # notification 은 도메인 이벤트를 발행하지 않지만 자기 DLQ 원장의 replay 재발행 주체다(D8 예외).
  # cleanup.cron 은 선언하지 않는다 — 3서비스도 @Scheduled 인라인 기본값을 쓴다(키를 여기만 두면 4벌이 갈라진다).
  outbox:
    retention: 7d          # PUBLISHED outbox_events 보존기간 (구현 ② PR3 과 동일 계약)
    # 서비스별 poller 소유권 분리 — order/product/payment 와 겹치지 않는 이름이어야 한다.
    lock-name: notificationOutboxPollingJob
    polling:
      batch-size: 100
      max-retry: 5
      publish-timeout: 6s
      cycle-timeout: 4m

  # DLQ 원장 운영 계약 (구현 ④-c-2a P5) — 동작 정책이므로 base 소유(ADR-0007).
  dead-letter:
    cluster-id: peekcart-local
    # 토픽별 프로비저닝 세대. 토픽을 삭제·재생성하면 배포 전에 값을 올린다.
    # 미등록 토픽을 참조하면 부팅이 아니라 적재 시점에 예외 — 기본값 암묵 허용 금지(§2.5).
    # 키는 원본 토픽 이름이다. origin 헤더 판독 실패 행(DLQ_ORIGIN)은 좌표로 '<topic>.dlq' 를 싣지만,
    # .dlq 는 원본과 함께 선언·재생성되므로 원본의 세대를 따른다(정확 일치 우선 → 없으면 .dlq 제거 후 재조회).
    topic-generations:
      order.created: 1
      order.cancelled: 1
      payment.completed: 1
      payment.failed: 1
      payment.refunded: 1
    alert:
      stale-after: 24h     # 이 시간을 넘긴 미결은 경보 대상
      backlog-threshold: 50
      cooldown: 6h         # 같은 경보 재발송 억제 — 없으면 스케줄 주기마다 도배된다
      scan-limit: 100
    payload:
      max-length: 8000     # 초과분은 잘리고 payload_truncated 로 표시
    # replay 개시 kill-switch (④-c-2b-4a P21). **기본값 false 가 계약이다** — 배포 순간 진입점이
    # 열리면 backfill·증적·리허설 이전에 replay 가 가능해지고, 닫는 데 롤링 재기동이 또 든다.
    # drain·롤백 계약(④-c-2b-4b)이 서기 전까지 운영에서 열지 않는다. 동작 정책이므로 base 소유(ADR-0007).
    replay:
      enabled: false
    purge:
      retention: 90d       # DISCARDED 후 보존기간. OPEN/ACKED 는 삭제 대상이 아니다
      batch-size: 500
      max-batches-per-run: 20

slack:
  webhook:
    url: ${SLACK_WEBHOOK_URL:https://hooks.slack.com/services/placeholder}
