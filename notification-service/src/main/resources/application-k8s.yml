spring:
  datasource:
    url: jdbc:mysql://mysql:3306/peekcart_notification?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:peekcart_notification}
    password: ${DB_PASSWORD:peekcart_notification}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: redis
      port: 6379
  kafka:
    bootstrap-servers: kafka:29092

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    com.peekcart: INFO

# 두 credential을 별도로 주입한 뒤 rollout해야 한다. legacy SLACK_WEBHOOK_URL은 사용하지 않는다.
# 누락 또는 같은 endpoint면 시작 실패 — docs/plans/D-092-slack-split.md 참고.
slack:
  webhook:
    url: ${SLACK_OPS_WEBHOOK_URL}
notification:
  slack:
    user-webhook-url: ${SLACK_USER_WEBHOOK_URL}
