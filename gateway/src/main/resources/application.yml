# gateway — Spring Cloud Gateway (ADR-0013 D3 · 구현 ③ PR3a)
#
# [ADR-0007] 라우트 predicate / rate limit 파라미터 / 알고리즘 allow-list 는 "동작 규약" 이므로 base 에 둔다.
# 환경마다 달라지는 것(업스트림 URI·JWKS·Redis)의 **값 소유자는 프로파일**(application-k8s.yml)이고,
# base 값은 로컬 실행 편의 기본값이다. 라우트 목록 구조는 base 소유 — 프로파일로 옮기면 전체가 복제된다.
# 라우트 uri 는 리스트 요소라 프로파일 override 가 불가능하므로 정규 계층형 키 placeholder
# `${app.gateway.upstream.<svc>-uri:...}` 를 쓴다(환경변수 override 는 APP_GATEWAY_UPSTREAM_USER_URI 로 가능).
server:
  port: 8080

spring:
  application:
    name: gateway

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cloud:
    gateway:
      server:
        webflux:
          # 라우트 정본 (계획 P11) — placeholder 금지, 실제 controller prefix 대조로 확정.
          # 주의: order 는 /api/v1/cart (단수) + /api/v1/orders, product 는 /api/v1/products + /api/v1/admin/products.
          # RequestRateLimiter 는 rate-limiter=failClosedRedisRateLimiter 를 명시한다 — SCG 기본
          # RedisRateLimiter 는 Redis 오류를 allowed=true 로 삼켜 fail-OPEN 이다(ADR-0013 D3 위반).
          routes:
            # --- user-service: 인증 전(signup/login/refresh)은 IP 키, 나머지(logout 등)는 userId 키 ---
            #     /api/v1/auth/** 를 통째로 pre-auth 로 묶으면 인증 API 인 logout 까지 IP 기준이 된다.
            - id: user-auth-preauth
              uri: ${app.gateway.upstream.user-uri:http://user-service:8080}
              predicates:
                - Path=/api/v1/auth/signup,/api/v1/auth/login,/api/v1/auth/refresh
                - Method=POST
              filters:
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@failClosedRedisRateLimiter}"
                    key-resolver: "#{@preAuthKeyResolver}"
                    fail-closed-rate-limiter.burstCapacity: 10
                    fail-closed-rate-limiter.windowSeconds: 1
                    deny-empty-key: true
            - id: user-auth
              uri: ${app.gateway.upstream.user-uri:http://user-service:8080}
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@failClosedRedisRateLimiter}"
                    key-resolver: "#{@userKeyResolver}"
                    fail-closed-rate-limiter.burstCapacity: 40
                    fail-closed-rate-limiter.windowSeconds: 1
                    deny-empty-key: true
            - id: user-users
              uri: ${app.gateway.upstream.user-uri:http://user-service:8080}
              predicates:
                - Path=/api/v1/users/**
              filters:
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@failClosedRedisRateLimiter}"
                    key-resolver: "#{@userKeyResolver}"
                    fail-closed-rate-limiter.burstCapacity: 40
                    fail-closed-rate-limiter.windowSeconds: 1
                    deny-empty-key: true

            # --- product-service (admin 을 먼저 둬야 /products/** 에 흡수되지 않는다) ---
            - id: product-admin
              uri: ${app.gateway.upstream.product-uri:http://product-service:8080}
              predicates:
                - Path=/api/v1/admin/products/**
              filters:
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@failClosedRedisRateLimiter}"
                    key-resolver: "#{@userKeyResolver}"
                    fail-closed-rate-limiter.burstCapacity: 40
                    fail-closed-rate-limiter.windowSeconds: 1
                    deny-empty-key: true
            - id: product-catalog
              uri: ${app.gateway.upstream.product-uri:http://product-service:8080}
              predicates:
                - Path=/api/v1/products/**
              filters:
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@failClosedRedisRateLimiter}"
                    key-resolver: "#{@ipKeyResolver}"
                    fail-closed-rate-limiter.burstCapacity: 100
                    fail-closed-rate-limiter.windowSeconds: 1
                    deny-empty-key: true

            # --- order-service (cart 는 단수) ---
            - id: order-cart
              uri: ${app.gateway.upstream.order-uri:http://order-service:8080}
              predicates:
                - Path=/api/v1/cart/**
              filters:
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@failClosedRedisRateLimiter}"
                    key-resolver: "#{@userKeyResolver}"
                    fail-closed-rate-limiter.burstCapacity: 40
                    fail-closed-rate-limiter.windowSeconds: 1
                    deny-empty-key: true
            - id: order-orders
              uri: ${app.gateway.upstream.order-uri:http://order-service:8080}
              predicates:
                - Path=/api/v1/orders/**
              filters:
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@failClosedRedisRateLimiter}"
                    key-resolver: "#{@userKeyResolver}"
                    fail-closed-rate-limiter.burstCapacity: 40
                    fail-closed-rate-limiter.windowSeconds: 1
                    deny-empty-key: true

            # --- payment-service ---
            - id: payment
              uri: ${app.gateway.upstream.payment-uri:http://payment-service:8080}
              predicates:
                - Path=/api/v1/payments/**
              filters:
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@failClosedRedisRateLimiter}"
                    key-resolver: "#{@userKeyResolver}"
                    fail-closed-rate-limiter.burstCapacity: 40
                    fail-closed-rate-limiter.windowSeconds: 1
                    deny-empty-key: true

            # --- notification-service ---
            - id: notification
              uri: ${app.gateway.upstream.notification-uri:http://notification-service:8080}
              predicates:
                - Path=/api/v1/notifications/**
              filters:
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@failClosedRedisRateLimiter}"
                    key-resolver: "#{@userKeyResolver}"
                    fail-closed-rate-limiter.burstCapacity: 40
                    fail-closed-rate-limiter.windowSeconds: 1
                    deny-empty-key: true


            # --- DLQ 원장 관리자 라우트 (④-c-2b-4b P27 · ADR-0022 §D5) ---
            #
            # 왜 필요한가: 도메인 서비스는 gateway 와 달리 관리 포트를 분리하지 않아 actuator 가 앱 포트에
            #   함께 있다. 그런데 라우트가 /api/v1/** 뿐이고 리소스 서비스는 게이트웨이가 서명한 내부
            #   토큰에서만 인증 주체를 세우므로(ADR-0017), port-forward 직접 호출은 Authentication 이 null
            #   이라 **DeadLetterEndpoint 의 ROLE_ADMIN 가드에 닿기 전에 인증에서 끊긴다**. 즉 ④-c-2b-4a 의
            #   진입점은 정확하지만 **부를 방법이 없었다**.
            #
            # 권한 판정을 여기로 옮기지 않는다: 게이트웨이는 서명 주체만 전달하고 ADMIN 검사는 리소스를
            #   소유한 서비스가 그대로 진다. 게이트웨이로 옮기면 이 라우트를 우회하는 경로가 생겼을 때
            #   가드가 함께 사라진다.
            #
            # **id 를 숫자로 못박는다** — actuator 아래 다른 엔드포인트로 새지 않게 하는 것이 이 라우트의
            #   유일한 위험 통제다. `{id:[0-9]+}` 면 `..`·인코딩 변형이 애초에 **매칭되지 않아** 404 다
            #   (rewrite 결과의 안전을 정규화에 맡기지 않는다). DeadLetterEndpoint 의 @Selector 도 Long 이다.
            # 공개 경로 SSOT 에 없으므로 인증 필수이고, deny-empty-key 로 미인증은 게이트웨이가 먼저 끊는다.
            - id: order-deadletter-admin-summary
              uri: ${app.gateway.upstream.order-uri:http://order-service:8080}
              predicates:
                - Path=/api/v1/admin/deadletter/order
              filters:
                - RewritePath=/api/v1/admin/deadletter/order, /actuator/deadletter
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@failClosedRedisRateLimiter}"
                    key-resolver: "#{@userKeyResolver}"
                    fail-closed-rate-limiter.burstCapacity: 20
                    fail-closed-rate-limiter.windowSeconds: 1
                    deny-empty-key: true
            - id: order-deadletter-admin-transition
              uri: ${app.gateway.upstream.order-uri:http://order-service:8080}
              predicates:
                - Path=/api/v1/admin/deadletter/order/{id:[0-9]+}
              filters:
                - RewritePath=/api/v1/admin/deadletter/order/(?<id>[0-9]+), /actuator/deadletter/$\{id}
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@failClosedRedisRateLimiter}"
                    key-resolver: "#{@userKeyResolver}"
                    fail-closed-rate-limiter.burstCapacity: 20
                    fail-closed-rate-limiter.windowSeconds: 1
                    deny-empty-key: true
            - id: product-deadletter-admin-summary
              uri: ${app.gateway.upstream.product-uri:http://product-service:8080}
              predicates:
                - Path=/api/v1/admin/deadletter/product
              filters:
                - RewritePath=/api/v1/admin/deadletter/product, /actuator/deadletter
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@failClosedRedisRateLimiter}"
                    key-resolver: "#{@userKeyResolver}"
                    fail-closed-rate-limiter.burstCapacity: 20
                    fail-closed-rate-limiter.windowSeconds: 1
                    deny-empty-key: true
            - id: product-deadletter-admin-transition
              uri: ${app.gateway.upstream.product-uri:http://product-service:8080}
              predicates:
                - Path=/api/v1/admin/deadletter/product/{id:[0-9]+}
              filters:
                - RewritePath=/api/v1/admin/deadletter/product/(?<id>[0-9]+), /actuator/deadletter/$\{id}
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@failClosedRedisRateLimiter}"
                    key-resolver: "#{@userKeyResolver}"
                    fail-closed-rate-limiter.burstCapacity: 20
                    fail-closed-rate-limiter.windowSeconds: 1
                    deny-empty-key: true
            - id: payment-deadletter-admin-summary
              uri: ${app.gateway.upstream.payment-uri:http://payment-service:8080}
              predicates:
                - Path=/api/v1/admin/deadletter/payment
              filters:
                - RewritePath=/api/v1/admin/deadletter/payment, /actuator/deadletter
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@failClosedRedisRateLimiter}"
                    key-resolver: "#{@userKeyResolver}"
                    fail-closed-rate-limiter.burstCapacity: 20
                    fail-closed-rate-limiter.windowSeconds: 1
                    deny-empty-key: true
            - id: payment-deadletter-admin-transition
              uri: ${app.gateway.upstream.payment-uri:http://payment-service:8080}
              predicates:
                - Path=/api/v1/admin/deadletter/payment/{id:[0-9]+}
              filters:
                - RewritePath=/api/v1/admin/deadletter/payment/(?<id>[0-9]+), /actuator/deadletter/$\{id}
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@failClosedRedisRateLimiter}"
                    key-resolver: "#{@userKeyResolver}"
                    fail-closed-rate-limiter.burstCapacity: 20
                    fail-closed-rate-limiter.windowSeconds: 1
                    deny-empty-key: true
            - id: notification-deadletter-admin-summary
              uri: ${app.gateway.upstream.notification-uri:http://notification-service:8080}
              predicates:
                - Path=/api/v1/admin/deadletter/notification
              filters:
                - RewritePath=/api/v1/admin/deadletter/notification, /actuator/deadletter
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@failClosedRedisRateLimiter}"
                    key-resolver: "#{@userKeyResolver}"
                    fail-closed-rate-limiter.burstCapacity: 20
                    fail-closed-rate-limiter.windowSeconds: 1
                    deny-empty-key: true
            - id: notification-deadletter-admin-transition
              uri: ${app.gateway.upstream.notification-uri:http://notification-service:8080}
              predicates:
                - Path=/api/v1/admin/deadletter/notification/{id:[0-9]+}
              filters:
                - RewritePath=/api/v1/admin/deadletter/notification/(?<id>[0-9]+), /actuator/deadletter/$\{id}
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@failClosedRedisRateLimiter}"
                    key-resolver: "#{@userKeyResolver}"
                    fail-closed-rate-limiter.burstCapacity: 20
                    fail-closed-rate-limiter.windowSeconds: 1
                    deny-empty-key: true

          # /.well-known/jwks.json · /swagger-ui/** · /api-docs/** 는 라우트가 없다 → 외부 404.
          # JWKS 는 Gateway 가 내부적으로만 fetch 한다(계획 P11 · 공개 경로 SSOT).

app:
  gateway:
    jwt:
      # 공개키 정본 = User JWKS (ADR-0013 D1). 로컬 미러 금지.
      # 스칼라 프로퍼티라 placeholder 없이 프로파일이 직접 override 한다(application-k8s.yml).
      jwks-uri: http://user-service:8080/.well-known/jwks.json
      jwks-timeout: PT2S
      jwks-refresh-cooldown: PT10S
      jwks-refresh-interval: PT5M
      # 전환기 HMAC fallback — 레거시 토큰의 실제 alg 는 HS512(HS256 아님).
      # 기본 off(RS256 단일). PR4 P22 에서 제거한다.
      hs512-fallback-enabled: false
      hs512-secret: ${JWT_SECRET:}
    # 내부 토큰 발행 (ADR-0017 D1/D2 · 구현 ③ PR3d).
    # 개인키는 산출물에 포함하지 않는다 — 로컬 dev 는 gitignored 파일, k8s 는 Secret Manager CSI 마운트
    # (PR3d-b). 값 자체가 아니라 *위치*만 설정으로 노출한다.
    # ttl/require-family-id 는 "동작 규약" 이라 base 소유다(ADR-0007).
    internal-token:
      active-kid: peekcart-gateway-dev-2026
      private-key-location: ${GATEWAY_INTERNAL_PRIVATE_KEY_LOCATION:file:./local-keys/dev-gateway-internal-private.pem}
      ttl-seconds: 30
      # family-less 레거시 신원은 내부 토큰을 발행하지 않는다(fail-closed).
      require-family-id: true
    # 공개 경로 SSOT (method + path) — 계획 §"공개 경로 SSOT".
    # method 까지 고정해 관리형 POST 가 무인증으로 새지 않게 한다.
    # 주의: 여기 매칭돼도 Bearer 토큰이 *제시되면* 반드시 검증한다(만료/위조/deny → 401).
    public:
      endpoints:
        - POST /api/v1/auth/signup
        - POST /api/v1/auth/login
        - POST /api/v1/auth/refresh
        - GET /api/v1/products
        - GET /api/v1/products/**
        - POST /api/v1/payments/webhook

# actuator 는 별도 관리 포트로 분리한다(계획 공개 경로 SSOT "외부 미노출").
# gateway 는 외부 진입점이라 8080 이 인터넷에 노출된다 — 같은 포트에 prometheus 를 두면
# 라우트가 없어도 gateway 자신의 handler 로 직접 접근된다(GW-2 c2:7/c3:5).
# k8s Service 는 8080 만 노출한다(PR3b) — 8081 은 probe 전용이다.
# scrape 은 PR4 에서 신설할 gateway-metrics Service(labels {app: gateway, monitoring-role: metrics})와
# ServiceMonitor 가 담당한다(ADR-0015 S5 canonical 5→6 확장은 PR4 소관).
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    com.peekcart.gateway: INFO
