# gateway — k8s 프로파일 (ADR-0007: 연결 정보 = 프로파일, 동작 규약 = base)
#
# 이 파일이 "k8s 에서 실제로 쓰이는 연결값" 의 단독 소유자다. base(application.yml) 의 동일 값은
# 로컬 실행 편의 기본값일 뿐이며, 클러스터 동작은 여기 선언으로 결정된다.
# ConfigMap(gateway-config)은 SPRING_PROFILES_ACTIVE=k8s 스위치만 담는다.
spring:
  data:
    redis:
      host: redis
      port: 6379

app:
  gateway:
    # 라우트 uri placeholder(${app.gateway.upstream.<svc>-uri:...}) 가 참조하는 값.
    upstream:
      user-uri: http://user-service:8080
      product-uri: http://product-service:8080
      order-uri: http://order-service:8080
      payment-uri: http://payment-service:8080
      notification-uri: http://notification-service:8080
    jwt:
      # 공개키 정본 = User JWKS (ADR-0013 D1).
      jwks-uri: http://user-service:8080/.well-known/jwks.json
    # 내부 토큰 서명 개인키의 **위치** (ADR-0017 D2).
    # 값이 아니라 경로만 설정에 둔다 — 키 자체는 Secret Manager 에서 CSI 로 투영되며
    # k8s Secret·env 를 경유하지 않는다(k8s/base/services/gateway/secretproviderclass.yml).
    # 마운트 경로/파일명은 SPC 의 `path:` 와 Deployment 의 `mountPath` 가 함께 결정한다 —
    # 셋 중 하나만 바뀌면 부팅 시 fail-fast 로 드러난다(InternalTokenIssuer 개인키 로딩).
    # env override seam 을 유지한다: 기본값은 k8s 의 CSI 마운트 경로이되,
    # 컨테이너 스모크처럼 CSI 가 없는 환경은 GATEWAY_INTERNAL_PRIVATE_KEY_LOCATION 으로 갈아끼운다.
    # 하드코딩하면 프로파일이 base 의 ${...} 치환을 덮어써서 주입이 무시되고 부팅이 fail-fast 한다.
    internal-token:
      private-key-location: ${GATEWAY_INTERNAL_PRIVATE_KEY_LOCATION:file:/etc/peekcart/gateway-keys/gateway-internal-private.pem}
