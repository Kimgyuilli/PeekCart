// peekcart-common-auth — Gateway 신뢰 인증 공유 모듈 (ADR-0014 D1/D3 · ADR-0017)
// bootJar 없음. 5개 서비스가 implementation 으로 의존한다.
// 소유: 내부 토큰 검증(InternalTokenVerifier/필터/공개키 레지스트리)/LoginUser·resolver/handler 2종/
//       WebMvcConfig·OpenApiConfig + User JWKS 용 RS256 공개키 계약(JwtKeyProperties/RsaPublicKeyRegistry).
// 발급(JwtTokenSigner)·블랙리스트 write/read 는 User·Gateway 소유(ADR-0014 D1 · ADR-0017 D5).

plugins {
    id 'java-library'
}

dependencies {
    // common 의 entity/response/exception/filter(MdcFilter) 등 — 공개 시그니처에 노출(handlers, configurer)
    api project(':common')

    // 내부 토큰 이름 계약(ADR-0017) — 서비스 테스트가 헤더/claim 이름을 참조하므로 api 로 전이 노출한다.
    // (서비스가 직접 선언하지 않아도 되어 assertNoServiceProjectDeps allowlist 를 건드리지 않는다)
    api project(':internal-token-contract')

    // security — JwtSecurityConfigurer(HttpSecurity)/handlers 가 소비자 compile 경로에 노출
    api 'org.springframework.boot:spring-boot-starter-security'

    // JWT verify — JwtTokenVerifier 내부 전용(공개 시그니처 미노출)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Redis 의존 없음 — deny 판정은 Gateway 소유(ADR-0017 D5).

    // OpenApiConfig(LoginUser ignore + OpenAPI 빈) 내부 전용
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'

    // 검증 단위 회귀
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // 발행측(gateway)과 공유하는 키/계약 토큰 fixture — 교차모듈 conformance
    testImplementation testFixtures(project(':internal-token-contract'))
}
