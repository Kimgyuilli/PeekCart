# Kafka 로그 볼륨 크기 (D-122). 산정 표는 docs/plans/D-122.md.
# minikube 는 부하 시험을 돌리지 않는 로컬 검증 환경이다(docs/01-project-overview.md). 그래서 gke 의 10Gi 와 다르게,
# 선언 토픽 상한 630MiB 와 KRaft metadata 200MiB 에 개발 트래픽의 __consumer_offsets 를 더한 2Gi 로 둔다.
# 기본 StorageClass(standard, k8s.io/minikube-hostpath)는 노드 디렉터리를 쓰므로 이 크기를 강제하지 않는다.
# 실제 한도는 minikube 노드 디스크다. 그 StorageClass 는 allowVolumeExpansion 이 없어 이미 만든 1Gi PVC 를
# 키우는 apply 는 거부된다. 그 경우 kafka Deployment 와 kafka-pvc 를 지우고 scripts/deploy-overlay.sh 를 다시 돌린다.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-pvc
  namespace: peekcart
spec:
  resources:
    requests:
      storage: 2Gi
