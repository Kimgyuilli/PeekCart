# MySQL CPU 상한 = 2000m. 이 파일 하나가 이 overlay 의 존재 이유였다.
#
# ⚠️ ADR-0027(2026-09-22) 이후 이 patch 는 **no-op 이다** — base 가 이미 2000m 다.
# 그래도 지우지 않는다: 읽기 경로 `list` 배속이 되돌림 게이트 실패(+11.5%)로
# **미확정**이라 재측정이 남아 있고(ADR-0027 §"모르는 채로" 1), 그때 필요한 것은
# A/B 대조 쌍이다. 짝인 `-500m` 이 이제 실질 손잡이이고 이쪽은 **명시적 기준점**으로 남는다.
# 값을 지우고 base 상속에 맡기면 "2000m 으로 쟀다"는 사실이 파일에서 사라진다.
#
# 주의: `mysql.yml:24-34` 의 strategy 가 **Recreate**(D-023, RWO PVC 단일 인스턴스)라
# 이 값을 바꾸면 Pod 가 **재기동**되고 InnoDB 버퍼풀이 식는다. 그래서 측정 설계가
# 단방향이 아니라 A→B→A′ 되돌림이다(계획서 §3-1, N6) — 재시작 효과와 CPU 효과를 가르기 위해.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: peekcart
spec:
  template:
    spec:
      containers:
        - name: mysql
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 1Gi
