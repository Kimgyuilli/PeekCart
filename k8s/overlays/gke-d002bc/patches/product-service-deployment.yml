# 측정: replicas 고정 + e2-standard-4 기준 resources (gke overlay 와 동일 값).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: peekcart
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: product-service
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
          env:
            # D-002a 대조군 스위치(CacheConfig:69/111). b'/c 는 ON 고정, P4 재현 시에만 OFF 로 돌린다.
            - name: PEEKCART_CACHE_ENABLED
              value: "true"
