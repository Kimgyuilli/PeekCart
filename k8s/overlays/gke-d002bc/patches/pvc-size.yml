# 측정 세션의 디스크 예산 (D-114). base 1Gi 는 2026-10-25 세션에서 약 6만 주문(7 run)에 가득 찼다(errno 28).
# MySQL 은 binlog(ROW·FULL, 보존 30일)를 그대로 둔다 — 끄거나 줄이면 커밋 경로가 바뀐다. 대신 공간을 준다.
# run 당 증가 83~123MiB(binlog 73%)라 10Gi 면 약 75 run 이다. 초기화 DELETE 가 binlog 를 더 쓰는 것도 그 안이다.
# Kafka 는 run 당 증가량이 측정된 적이 없어(D-114 전에는 PVC 에 쓰지 않았다) 같은 크기로 두고,
# d078-s3-run.sh 가 run 마다 남기는 disk 기록으로 잰다.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: peekcart
spec:
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-pvc
  namespace: peekcart
spec:
  resources:
    requests:
      storage: 10Gi
