# GKE: Internal LoadBalancer 노출 (VPC 내부) — 외부 진입점 정본.
# 이 Service 는 8080 만 게시한다(base). 관리 포트 8081 을 여기에 추가하면 LB 가 actuator 를 함께
# 노출하므로 금지 — scripts/gateway-exposure-lint.sh 가 렌더 산출에서 강제한다.
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: peekcart
  annotations:
    networking.gke.io/load-balancer-type: "Internal"
spec:
  type: LoadBalancer
