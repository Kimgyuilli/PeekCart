# 측정 전용 표면은 **gateway Internal LB 하나뿐**이다 — patches/gateway-service.yml 이 만든다.
#
# gke-d002a 는 product-service 에 별도 Internal LB 를 붙였다(gateway 를 뺐기 때문). 여기서는
# 붙이지 않는다: 도메인 서비스를 직접 노출하면 내부 토큰 검증을 우회하는 표면이 생기고(401 이 아니라
# **인증 없이 도달 가능한 경로**가 되는지 여부가 SIGNED_ONLY 설정에 달리게 된다), 무엇보다
# 측정 대상 경로가 gateway 경유이므로 우회 표면은 측정에 쓸 일이 없다.
#
# MySQL/Kafka 조회(P5·P8·P10)는 LB 가 아니라 `kubectl exec` / `port-forward` 로 한다.
# 이 파일은 그 결정을 기록으로 남기기 위해 존재한다 — 리소스를 만들지 않는다.
