# Kafka 로그 볼륨 크기 (D-122). 산정 표는 docs/plans/D-122.md.
# 시간 보존 7일은 그대로 두고(ADR-0020) 크기 기준 브로커 보존은 넣지 않는다. 대신 볼륨이 상한을 담게 한다.
# - 선언 토픽 30개는 토픽 config(retention.bytes + segment.bytes)로 묶여 최대 630MiB 다(ADR-0020 §D4-1).
# - 묶이지 않는 것은 __consumer_offsets(50 파티션, compact, 세그먼트 100MiB)와 KRaft metadata 로그다.
#   compact 는 닫힌 세그먼트만 줄이므로 파티션마다 활성 세그먼트 100MiB 가 남을 수 있다: 50 x 100MiB.
# - 합계 상한 약 6.0GiB. 10Gi(ext4 약 9.8GiB)면 약 3.8GiB 가 남는다. 측정 overlay(gke-d002bc)와 같은 크기다.
# standard-rwo 는 온라인 확장을 지원한다(2026-10-25 세션에서 mysql-pvc 를 Pod 재시작 없이 키웠다).
# PVC 는 줄일 수 없다. 이 값을 1Gi 로 되돌리면 apply 가 거부되고, 되돌리려면 PVC 를 지우고 다시 만들어야 한다(Kafka 데이터 유실).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-pvc
  namespace: peekcart
spec:
  resources:
    requests:
      storage: 10Gi
