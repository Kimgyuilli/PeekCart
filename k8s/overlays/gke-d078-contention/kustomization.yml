apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ⚠️ D-078 ⑤ 경합 측정 전용 — 운영 매니페스트 아님.
#
# 무엇을 재나: jitter 도입(ADR-0025 D2) 뒤 동일 상품 경합에서 낙관락 충돌과 DLQ 유입. before 는
# Phase 4 `d002bc` 의 replicas=3 경합 run(충돌 7 · DLQ 7, 주문 9,782)이다. 그 조건을 파일로 고정한다.
#
# - product replicas 3: replicas 1 이면 예약 consumer 가 시스템 전체에 하나라 경합이 **구조적으로**
#   생기지 않는다(`docs/progress/evidence/d002bc-gke-20260917.md` §D-002c). Phase 4 는 이 값을
#   `kubectl scale` 로 맞췄다 — 조건이 파일 밖에 있었다.
# - order outbox 폴링은 덮지 않는다. Phase 4 경합 run 은 500ms · 500건을 env 로 덮었는데(증적 §배포 편차 3),
#   ADR-0045 로 base 기본값이 같은 값이 됐다(order·product·payment 모두, 최소 보존 400ms). order.created 발행
#   속도라는 경합의 입력은 그대로이고, 재측정은 이 기본값 자체를 잰다. 덮어쓰면 base 를 다시 바꿨을 때 기본값이
#   아닌 값을 재게 된다.
# - MySQL 2000m: 상위 `gke-d002bc-mysql-2000m` 을 그대로 받는다.
#
# 렌더:
#   kubectl kustomize k8s/overlays/gke-d078-contention
resources:
  - ../gke-d002bc-mysql-2000m

patches:
  - path: patches/product-service-replicas.yml
  # order 프로브 완화(2026-10-25 재측정 S3 에서 추가). 이유는 patch 파일 주석.
  - path: patches/order-service-probes.yml
