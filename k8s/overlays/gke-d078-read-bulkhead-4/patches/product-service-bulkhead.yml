# ADR-0037 bulkhead 상한 4. env 이름은 `@Value("${peekcart.cache.db-max-concurrency:1}")` 의 환경변수 형식
# (점은 밑줄, 하이픈 제거, 대문자)이고, Spring Boot 3.5.12 에서 이 이름이 4 로 읽히는 것을 확인했다(계획서 §2).
# 상위 `gke-d002a` 가 같은 이름으로 "1" 을 두므로 env 목록이 이름으로 병합되어 값만 바뀐다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: peekcart
spec:
  template:
    spec:
      containers:
        - name: product-service
          env:
            - name: PEEKCART_CACHE_DBMAXCONCURRENCY
              value: "4"
