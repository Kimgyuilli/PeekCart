apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ⚠️ D-078 재측정 S2(읽기 경로) 전용 — 운영 매니페스트 아님. 계획서 docs/plans/D-078-remeasure-plan.md
#
# 무엇을 재나: ADR-0037 조회 DB 진입 bulkhead 의 상한을 1 에서 4 로 올렸을 때 캐시 miss 경로(캐시 OFF)의
# 처리율과 DB·커넥션 풀 여유. ADR-0037 은 "측정으로 상한 증액을 입증하기 전에는 1" 이므로 이 overlay 가
# 그 측정의 조건이다. 상한 1 은 상위 `gke-d002a-mysql-2000m` 이 렌더한다(gke-d002a 가 1 을 파일에 고정).
#
# 4 의 근거: 코드는 양수이면서 Hikari maximumPoolSize 보다 작은 값만 받는다(`ProductReadBulkheadConfig`,
# 어기면 기동 실패). product-service 는 풀 크기를 설정하지 않아 기본 10 이고, 4 는 그 안에서 6개를
# 쓰기·메시지 소비·스케줄러에 남긴다. 인스턴스별 상한이다(측정 overlay 의 product 는 1 replica).
#
# 상한을 바꾸면 product-service 만 재기동한다. MySQL 은 상위와 같은 2000m 이라 재기동하지 않는다.
#
# 렌더:
#   kubectl kustomize k8s/overlays/gke-d078-read-bulkhead-4
resources:
  - ../gke-d002a-mysql-2000m

patches:
  - path: patches/product-service-bulkhead.yml
