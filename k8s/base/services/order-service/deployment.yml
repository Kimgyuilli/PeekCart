apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: peekcart
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: peekcart
spec:
  # replicas 를 선언하지 않는다 — gke overlay 의 HPA(minReplicas 1 / maxReplicas 3)가 소유한다.
  # min 이 1 이라 평소엔 무해해 보이지만, 부하로 3 까지 올라간 상태에서 `kubectl apply -k` 하면
  # 1 로 깎인다. 강제: scripts/hpa-replicas-ownership-lint.sh
  # 무중단 rollout — header-trust 전환/이미지 교체 시 가용 replica 유지(PR3c §8 롤아웃 계약)
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        app.kubernetes.io/name: order-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: peekcart
    spec:
      # gateway 내부 토큰 **공개키** 마운트(ADR-0017 D3 · PR3d-b). 비밀이 아니라 ConfigMap 이며,
      # 이미지 베이크 대신 두는 이유는 회전 overlap 이 이미지 변경 없이 끝나야 하기 때문이다(P8).
      volumes:
        - name: internal-token-keys
          configMap:
            name: internal-token-keys
      containers:
        - name: order-service
          image: ghcr.io/kimgyuilli/peekcart-order-service:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: order-service-config
            - configMapRef:
                name: internal-token-binding
            - secretRef:
                name: order-service-secret
          volumeMounts:
            - name: internal-token-keys
              mountPath: /etc/peekcart/internal-token-keys
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          # 프로브 수치(D-108, docs/plans/D-108-probe-policy.md): 부하 중 응답 지연만으로 kill 하지 않는다.
          # 기본 timeout 1초 × 3회는 CPU 포화나 Tomcat 스레드 대기만으로 넘어, 2026-10-25 부하 측정에서 kubelet 이
          # order-service 를 재시작했다. liveness 는 약 2분(5초 × 12회)을 기다린다. 측정 overlay 에서 재시작 0 을 낸 값이다.
          # readiness 는 약 30초(5초 × 3회)라 liveness 보다 먼저 endpoint 에서 빠진다. 5개 백엔드 서비스가 같은 값을 쓴다.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: peekcart
  labels:
    app: order-service
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
