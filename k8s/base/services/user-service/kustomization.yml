apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 측정 overlay 재사용 진입점. 운영 base의 리소스 목록은 base/kustomization.yml이 소유한다.
resources:
  - serviceaccount.yml
  - secretproviderclass.yml
  - configmap.yml
  - secret.yml
  - deployment.yml
  # 측정 세션도 앱 메트릭을 scrape 한다. apply 전에 관측 스택(ServiceMonitor CRD)이 있어야 한다(D-106 ③).
  - servicemonitor.yml
