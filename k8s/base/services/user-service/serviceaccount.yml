# user-service 워크로드 신원 — Secret Manager 접근 주체 (ADR-0013 D2 · 구현 ③ PR3d-b-2 P2)
#
# gateway KSA 와 **별개의 GSA** 에 바인딩된다(ADR-0017 D3 키 도메인 분리). 한 GSA 에 두 secret 의
# accessor 를 몰아주거나 두 KSA 를 같은 GSA 에 바인딩하면, CSI 마운트는 분리돼 있어도 신원 층위에서
# 교차 접근이 열린다 — 렌더로는 보이지 않는 경로라 lint 가 GSA 를 exact 로 대조한다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: user-service
  namespace: peekcart
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: peekcart
  annotations:
    iam.gke.io/gcp-service-account: peekcart-user-signer@PROJECT_ID_PLACEHOLDER.iam.gserviceaccount.com
automountServiceAccountToken: false
