# gateway — Spring Cloud Gateway (ADR-0013 D3 · 구현 ③ PR3b)
#
# 도메인 서비스가 아니라 *인프라 게이트웨이* 다 — canonical 도메인 5(ADR-0010 §5)와 분리해 취급하며
# 디렉터리명도 `-service` 접미사 없이 `gateway` 다(scripts/image-contract-lint.sh 의 INFRA_SERVICES).
#
# 포트 분리(ADR-0013 D3 · PR3a): 8080=외부 트래픽, 8081=actuator 관리 포트.
# Service 는 8080 만 게시한다 — overlay 가 이 Service 를 NodePort/LoadBalancer 로 patch 하므로
# 8081 을 함께 선언하면 관리 엔드포인트(/actuator/prometheus)가 외부로 노출된다.
# probe 는 management.server.port 를 따라 8081 이다(도메인 5서비스는 8080).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: peekcart
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: peekcart
spec:
  # replicas 를 선언하지 않는다 — gke overlay 의 HPA(minReplicas 2)가 소유한다.
  # 여기에 replicas 를 두면 `kubectl apply -k` 가 매번 그 값으로 덮어써 HPA 가 올려둔 수를
  # 최소값 아래로 깎는다(배포마다 가용 Pod 가 minReplicas 미만이 되는 구간 발생).
  # 강제: scripts/hpa-replicas-ownership-lint.sh
  # 외부 진입점이라 롤아웃 중에도 수용 가능한 Pod 가 항상 있어야 한다(PR3b runbook 의 rollout 공통 조건).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
        app.kubernetes.io/name: gateway
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: peekcart
    spec:
      # Secret Manager 접근 주체(Workload Identity) — serviceaccount.yml 참조.
      # `default` KSA 로 두면 NS 의 모든 Pod 가 내부 토큰 개인키에 접근할 수 있다(P2).
      serviceAccountName: gateway
      # Kubernetes API 를 호출하지 않는다 — 토큰 자동 마운트 불필요.
      # CSI provider 는 드라이버의 TokenRequest 로 KSA 신원을 받으므로 이 설정과 무관하다.
      automountServiceAccountToken: false
      # initContainers 없음(계약): gateway 는 마이그레이션·비밀 복사 등 선행 작업이 없다.
      #
      # 비밀 계약(scripts/gateway-exposure-lint.sh 가 강제) — PR3d-b 에서 변경됨:
      #   구: "Secret 참조 0" (gateway 가 소비하는 비밀이 없었다)
      #   신: "승인된 CSI 마운트 **정확히 1개**" — 내부 토큰 서명 개인키(ADR-0017 D2).
      # k8s Secret(`secretKeyRef`/`secret:` volume/projected Secret)·env 주입은 여전히 **금지**다.
      # 사용자 access token 개인키는 user-service Pod 전용이고(ADR-0013 D2) 여기 오면 안 된다 —
      # 두 키의 배타적 소유를 scripts/internal-key-ownership-lint.sh 가 전 workload 에서 검사한다.
      volumes:
        - name: internal-signing-key
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: gateway-internal-signing-key
      containers:
        - name: gateway
          image: ghcr.io/kimgyuilli/peekcart-gateway:latest
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: gateway-config
          volumeMounts:
            # readOnly 는 volume·volumeMount 양쪽에 있어야 한다 — 한쪽만이면 쓰기 가능한 경로가 남는다.
            - name: internal-signing-key
              mountPath: /etc/peekcart/gateway-keys
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          # readiness 는 JWKS usable key ≥ 1 을 반영한다(JwksReadinessConfig) — cold start 시
          # 공개키를 못 받은 인스턴스는 트래픽을 받지 않는다. liveness 는 프로세스 생존만 본다.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: peekcart
  labels:
    app: gateway
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    # 8080 단일 포트. 관리 포트(8081) scrape 는 아래 gateway-metrics Service 가 담당한다(PR4).
    - name: http
      port: 8080
      targetPort: 8080
---
# gateway-metrics — 관리 포트(8081) scrape 전용 ClusterIP Service (PR4 · ADR-0024 D1 집합 B).
#
# 왜 별도 Service 인가: 위 `gateway` Service 는 overlay 에서 NodePort/LoadBalancer 로 patch 된다.
#   거기에 8081 을 함께 게시하면 /actuator/prometheus 가 인터넷으로 나간다(PR3a 포트 분리의 무력화).
#   scrape 는 클러스터 내부(Prometheus)에서만 오므로 ClusterIP 로 분리한다.
#
# labels 두 개가 **논리곱**으로 ServiceMonitor selector 와 맞물린다 — `app: gateway` 만으로 선택하면
#   SM 이 위 public Service(8081 없음)까지 매칭해 servicemonitor-selector-lint 의 "매칭 Service 에
#   endpoint port 존재" 검사가 실패한다.
#
# **overlay 에서 이 Service 를 patch 하지 않는다** — 타입이 바뀌면 관리 포트가 그대로 노출된다.
#   gateway-exposure-lint 가 ClusterIP 고정을 강제한다.
apiVersion: v1
kind: Service
metadata:
  name: gateway-metrics
  namespace: peekcart
  labels:
    app: gateway
    monitoring-role: metrics
spec:
  type: ClusterIP
  selector:
    app: gateway
  ports:
    - name: management
      port: 8081
      targetPort: 8081
