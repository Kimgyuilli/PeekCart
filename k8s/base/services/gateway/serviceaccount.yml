# gateway 워크로드 신원 — Secret Manager 접근 주체 (ADR-0017 D2 · 구현 ③ PR3d-b-2 P2)
#
# 왜 전용 KSA 인가:
#   SecretProviderClass 는 "노드 인증은 Workload Identity 로 한다"(정적 자격증명 금지)고 규정하는데,
#   그 Workload Identity 의 **주체가 될 KSA 가 없었다** — PR3d-b-1 까지 이 레포에는 ServiceAccount
#   객체가 0건이라 모든 Pod 가 `default` KSA 로 떴다. `default` 에 GSA 를 바인딩하면 그 네임스페이스의
#   **모든 Pod** 가 내부 토큰 서명 개인키를 Secret Manager 에서 직접 꺼낼 수 있다 — CSI 마운트를
#   전수 검사하는 workload-key-ownership-lint 를 우회하는 경로가 생긴다.
#
# GCP provider 는 CSI 드라이버의 TokenRequest 로 이 KSA 의 신원을 받아간다. Pod 자신은 k8s API 를
# 호출하지 않으므로 `automountServiceAccountToken: false` 와 충돌하지 않는다(gateway PodSpec 의
# 그 설정은 gateway-exposure-lint 계약이므로 그대로 유지한다).
#
# PROJECT_ID_PLACEHOLDER 치환은 이미지 경로·SPC 와 동일한 operator 절차다.
# 클러스터 측 대응 작업(GSA 생성 · secretAccessor 부여 · workloadIdentityUser 바인딩)은
# 계획서 P2 참조 — 이 파일만으로는 접근 권한이 생기지 않는다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway
  namespace: peekcart
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: peekcart
  annotations:
    iam.gke.io/gcp-service-account: peekcart-gateway-signer@PROJECT_ID_PLACEHOLDER.iam.gserviceaccount.com
# 이 KSA 를 쓰는 Pod 는 k8s API 를 호출하지 않는다 — 토큰 자동 마운트 불필요.
automountServiceAccountToken: false
