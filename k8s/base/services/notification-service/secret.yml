apiVersion: v1
kind: Secret
metadata:
  name: notification-service-secret
  namespace: peekcart
type: Opaque
# 평문 매니페스트(전환기 템플릿) — KMS/Vault 외부화는 ③ Gateway 보안 묶음(L-002). 실배포 시 값 교체.
stringData:
  DB_USERNAME: peekcart_notification
  DB_PASSWORD: peekcart_notification
  # Slack credentials are supplied outside git before rollout; no placeholder values here.
  # Required: SLACK_USER_WEBHOOK_URL and SLACK_OPS_WEBHOOK_URL (distinct endpoints).
  # SLACK_WEBHOOK_URL alone no longer starts notification-service.
  # See docs/runbooks/slack-webhook-secret.md for injection, restart, and rotation.
