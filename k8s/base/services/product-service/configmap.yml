apiVersion: v1
kind: ConfigMap
metadata:
  name: product-service-config
  namespace: peekcart
data:
  SPRING_PROFILES_ACTIVE: k8s
  # Phase 3 부하 테스트 — 캐싱 전/후 TPS 비교 토글 (D-002 격리 재측정, product 전용).
  # product CacheConfig @ConditionalOnProperty(peekcart.cache.enabled). baseline 측정 시 "false".
  PEEKCART_CACHE_ENABLED: "true"
  # DLQ replay 진입점 kill-switch (④-c-2b-4b P24 · ADR-0022 §D1).
  # **기본값은 false 이고(base application.yml 소유) 여기서도 닫아둔다** — 준비(backfill·증적·리허설)가
  # 끝난 뒤 "true" 로 바꾸고 **롤링 재기동**해야 열린다. 즉시 반영되지 않는다(정적 설정).
  # 문자열로 커밋한다 — ConfigMap data 는 문자열만 담는다.
  APP_DEAD_LETTER_REPLAY_ENABLED: "false"
