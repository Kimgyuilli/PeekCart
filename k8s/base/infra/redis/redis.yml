apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: peekcart
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: peekcart
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: peekcart
spec:
  replicas: 1
  # RWO PVC 를 쓰는 단일 인스턴스라 **Recreate 여야 한다** (D-023).
  #
  # 기본값 RollingUpdate 는 maxSurge 로 **신 파드를 먼저 띄운다**. 신·구가 같은 노드에 스케줄되면
  # 둘 다 같은 RWO 볼륨을 마운트해 **같은 데이터 디렉터리를 동시에 잡는다**. D-002 측정 세션에서
  # MySQL 이 실제로 이 상태에 빠졌다(신 파드 mysqld 기동 실패, `scale 0→1` 로 회피).
  # 트리거는 특별하지 않다 — 이미지 태그·리소스·ConfigMap 참조 등 **파드 템플릿을 바꾸는 모든 apply**.
  #
  # 대가는 교체 중 짧은 다운타임이다. 단일 인스턴스라 어차피 무중단이 아니었고,
  # 데이터 디렉터리를 두 프로세스에 노출하는 것보다 낫다.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: peekcart
    spec:
      containers:
        - name: redis
          image: redis:7.2
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: redis-data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: peekcart
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
