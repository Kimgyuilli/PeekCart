apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: peekcart
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: peekcart
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: peekcart
spec:
  replicas: 1
  # RWO PVC 를 쓰는 단일 인스턴스라 **Recreate 여야 한다** (D-023).
  #
  # 기본값 RollingUpdate 는 maxSurge 로 **신 파드를 먼저 띄운다**. 신·구가 같은 노드에 스케줄되면
  # 둘 다 같은 RWO 볼륨을 마운트해 **같은 데이터 디렉터리를 동시에 잡는다**. D-002 측정 세션에서
  # MySQL 이 실제로 이 상태에 빠졌다(신 파드 mysqld 기동 실패, `scale 0→1` 로 회피).
  # 트리거는 특별하지 않다 — 이미지 태그·리소스·ConfigMap 참조 등 **파드 템플릿을 바꾸는 모든 apply**.
  #
  # 대가는 교체 중 짧은 다운타임이다. 단일 인스턴스라 어차피 무중단이 아니었고,
  # 데이터 디렉터리를 두 프로세스에 노출하는 것보다 낫다.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
        app.kubernetes.io/name: mysql
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: peekcart
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          # DB-per-service (구현 ② PR2): 단일 MYSQL_DATABASE/USER 생성 책임을 init ConfigMap(5 DB/계정)으로
          # 이관. root 비밀번호만 명시하고, init .sh 가 쓰는 *_DB_PASSWORD 는 envFrom 으로 노출.
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: DB_PASSWORD
          envFrom:
            - secretRef:
                name: mysql-secret
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            - name: mysql-init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - localhost
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-pvc
        - name: mysql-init
          configMap:
            name: mysql-init-config
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: peekcart
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
