# Grafana unified alerting — alert 규칙 provisioning (ConfigMap, Grafana sidecar 자동 로드).
# 범위: 규칙 평가 + Grafana UI 시각화/알림 상태 표시까지.
# contact point/notification policy 는 의도적으로 미provisioning —
#   "alert 발화 → 외부 채널(Slack/PagerDuty) 발송" 경로는 본 파일 비대상이며,
#   운영 알림 채널 설계는 L-004(Phase 4)로 이관(부하테스트용 임시 클러스터엔 불필요).
# 주의: 앱 비즈니스/운영 Slack(Notification 도메인 · Outbox FAILED 통지)은 앱이
#   SlackNotificationClient 로 직접 발송하는 별개 경로이며 본 alert 경로와 무관.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting-rules
  namespace: monitoring
  labels:
    grafana_alert: "1"
data:
  alerts.yaml: |-
    apiVersion: 1
    groups:
      - orgId: 1
        name: PeekCart Alerts
        folder: PeekCart
        interval: 1m
        rules:
          - uid: peekcart-high-error-rate
            title: "High Error Rate (5xx > 5%)"
            condition: C
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  expr: "sum by (application)(rate(http_server_requests_seconds_count{application=~\"gateway|notification-service|order-service|payment-service|product-service|user-service\", status=~\"5..\"}[5m]))"
                  instant: false
                  range: true
              - refId: B
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  expr: "sum by (application)(rate(http_server_requests_seconds_count{application=~\"gateway|notification-service|order-service|payment-service|product-service|user-service\"}[5m]))"
                  instant: false
                  range: true
              - refId: C
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  type: math
                  expression: "($B > 0) && (($A / $B) * 100 > 5)"
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "PeekCart 5xx 에러율 5% 초과 — {{ $labels.application }}"
              description: "{{ $labels.application }} 의 최근 5분간 5xx 에러율이 5%를 초과했습니다."
          - uid: peekcart-slow-response
            title: "Slow API Response (p95 > 2s)"
            condition: B
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  expr: "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{application=~\"gateway|notification-service|order-service|payment-service|product-service|user-service\", uri!~\"/actuator.*\"}[5m])) by (le, application))"
                  instant: false
                  range: true
              - refId: B
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator:
                        type: gt
                        params: [2]
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "PeekCart API p95 응답시간 2초 초과 — {{ $labels.application }}"
              description: "{{ $labels.application }} 의 최근 5분간 API p95 응답시간이 2초를 초과했습니다."
          - uid: peekcart-target-down
            title: "Peekcart Target Down (up == 0)"
            condition: B
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  expr: "count by (service)(up{namespace=\"peekcart\"} == 0) or on() vector(0)"
                  instant: true
                  range: false
              - refId: B
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  type: math
                  expression: "$A > 0"
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "PeekCart 타겟 스크랩 실패 (up == 0) — {{ $labels.service }}"
              description: "{{ $labels.service }} 의 타겟을 Prometheus 가 스크랩 시도했으나 실패 (네트워크, 인증, /actuator/prometheus 500 등). up 시계열은 존재하되 0. Error Rate 패널의 강제 0% 표시와 구분하는 신호."
          - uid: peekcart-scrape-absent-notification-service
            title: "Peekcart Metrics Scrape Absent — notification-service"
            condition: B
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  expr: "absent(up{namespace=\"peekcart\", service=\"notification-service\"}) or on() vector(0)"
                  instant: true
                  range: false
              - refId: B
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  type: math
                  expression: "$A > 0"
            for: 2m
            labels:
              severity: critical
              service: notification-service
            annotations:
              summary: "PeekCart up 시계열 부재 — notification-service (ServiceMonitor 미매칭 / 서비스 삭제)"
              description: "notification-service 의 up 메트릭 series 부재. ServiceMonitor selector 미스매치, 서비스 삭제, Prometheus 설정 문제 등 구조적 부재. 스크랩 실패(up == 0) 는 peekcart-target-down 에서 감지." 
          - uid: peekcart-scrape-absent-order-service
            title: "Peekcart Metrics Scrape Absent — order-service"
            condition: B
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  expr: "absent(up{namespace=\"peekcart\", service=\"order-service\"}) or on() vector(0)"
                  instant: true
                  range: false
              - refId: B
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  type: math
                  expression: "$A > 0"
            for: 2m
            labels:
              severity: critical
              service: order-service
            annotations:
              summary: "PeekCart up 시계열 부재 — order-service (ServiceMonitor 미매칭 / 서비스 삭제)"
              description: "order-service 의 up 메트릭 series 부재. ServiceMonitor selector 미스매치, 서비스 삭제, Prometheus 설정 문제 등 구조적 부재. 스크랩 실패(up == 0) 는 peekcart-target-down 에서 감지." 
          - uid: peekcart-scrape-absent-payment-service
            title: "Peekcart Metrics Scrape Absent — payment-service"
            condition: B
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  expr: "absent(up{namespace=\"peekcart\", service=\"payment-service\"}) or on() vector(0)"
                  instant: true
                  range: false
              - refId: B
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  type: math
                  expression: "$A > 0"
            for: 2m
            labels:
              severity: critical
              service: payment-service
            annotations:
              summary: "PeekCart up 시계열 부재 — payment-service (ServiceMonitor 미매칭 / 서비스 삭제)"
              description: "payment-service 의 up 메트릭 series 부재. ServiceMonitor selector 미스매치, 서비스 삭제, Prometheus 설정 문제 등 구조적 부재. 스크랩 실패(up == 0) 는 peekcart-target-down 에서 감지." 
          - uid: peekcart-scrape-absent-product-service
            title: "Peekcart Metrics Scrape Absent — product-service"
            condition: B
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  expr: "absent(up{namespace=\"peekcart\", service=\"product-service\"}) or on() vector(0)"
                  instant: true
                  range: false
              - refId: B
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  type: math
                  expression: "$A > 0"
            for: 2m
            labels:
              severity: critical
              service: product-service
            annotations:
              summary: "PeekCart up 시계열 부재 — product-service (ServiceMonitor 미매칭 / 서비스 삭제)"
              description: "product-service 의 up 메트릭 series 부재. ServiceMonitor selector 미스매치, 서비스 삭제, Prometheus 설정 문제 등 구조적 부재. 스크랩 실패(up == 0) 는 peekcart-target-down 에서 감지." 
          - uid: peekcart-scrape-absent-user-service
            title: "Peekcart Metrics Scrape Absent — user-service"
            condition: B
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  expr: "absent(up{namespace=\"peekcart\", service=\"user-service\"}) or on() vector(0)"
                  instant: true
                  range: false
              - refId: B
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  type: math
                  expression: "$A > 0"
            for: 2m
            labels:
              severity: critical
              service: user-service
            annotations:
              summary: "PeekCart up 시계열 부재 — user-service (ServiceMonitor 미매칭 / 서비스 삭제)"
              description: "user-service 의 up 메트릭 series 부재. ServiceMonitor selector 미스매치, 서비스 삭제, Prometheus 설정 문제 등 구조적 부재. 스크랩 실패(up == 0) 는 peekcart-target-down 에서 감지." 
          # gateway 는 도메인 서비스가 아니라 인프라 진입점이지만 scrape 부재의 의미는 같다(ADR-0024 D3).
          # service 라벨 값이 `gateway` 가 아니라 `gateway-metrics` 인 것은 오타가 아니다 —
          # up{service=} 는 scrape 된 **Service 의 이름**이고, 관리 포트는 별도 ClusterIP Service 가 게시한다.
          - uid: peekcart-scrape-absent-gateway-metrics
            title: "Peekcart Metrics Scrape Absent — gateway-metrics"
            condition: B
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  expr: "absent(up{namespace=\"peekcart\", service=\"gateway-metrics\"}) or on() vector(0)"
                  instant: true
                  range: false
              - refId: B
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  type: math
                  expression: "$A > 0"
            for: 2m
            labels:
              severity: critical
              service: gateway-metrics
            annotations:
              summary: "PeekCart up 시계열 부재 — gateway-metrics (ServiceMonitor 미매칭 / 서비스 삭제)"
              description: "gateway 관리 포트(8081) scrape 대상인 gateway-metrics Service 의 up 메트릭 series 가 없습니다. 인증 실패·rate limit 메트릭(S9)이 통째로 수집되지 않는 상태입니다. ServiceMonitor selector 미스매치(두 라벨 논리곱), Service 삭제, Prometheus 설정 문제를 확인하십시오."
          # --- 구현 ④-d-1 P4: 미결이 쌓이는 표면만 alert 로 둔다 ---
          # 메트릭을 늘린다고 alert 를 그만큼 만들지 않는다. 울리지 않는 alert 는 소음이고
          # promql-lint 의 required 집합을 그만큼 넓힌다. 예약 성공/확정/복구 같은 흐름 지표는
          # 대시보드·조회용이고, "사람이 손대지 않으면 안 없어지는 것" 만 alert 대상이다.
          - uid: peekcart-compensation-backlog
            title: "Saga Compensation Backlog (미해소 보상 원장)"
            condition: B
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  # order-service 전용 메트릭이다 — 보상 원장(order_compensations)을 order 만 소유한다.
                  # 5서비스 regex 로 걸면 없는 series 를 기다리는 alert 가 된다(ADR-0012 D1).
                  # status 를 명시 고정한다 — 나중에 상태가 추가돼도 조용히 alert 대상에 들어오지 않는다.
                  expr: "sum by (application)(saga_compensation_backlog{application=~\"order-service\", status=~\"open|refund_failed\"})"
                  instant: true
                  range: false
              - refId: B
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  type: math
                  expression: "$A > 0"
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "PeekCart 미해소 보상 원장 존재 — {{ $labels.application }}"
              description: "order_compensations 에 OPEN 또는 REFUND_FAILED 건이 남아 있습니다. OPEN 은 환불 요청이 아직 종결되지 않은 것이고, REFUND_FAILED 는 '닫혔지만 해결되지 않은' 상태라 사람이 처리해야 합니다(ADR-0018 D4). for=15m 은 정상 환불 왕복 시간을 넘긴 잔존만 잡기 위한 값입니다."
          - uid: peekcart-dlq-backlog
            title: "DLQ Backlog (미결 DLQ 원장)"
            condition: B
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  # DLQ 원장은 소비 서비스 4곳이 소유한다 — user-service 는 Kafka 소비자가 없어 제외.
                  expr: "sum by (application)(dlq_backlog{application=~\"notification-service|order-service|payment-service|product-service\"})"
                  instant: true
                  range: false
              - refId: B
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  type: math
                  expression: "$A > 0"
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "PeekCart 미결 DLQ 원장 존재 — {{ $labels.application }}"
              description: "dead_letter_records 에 OPEN/ACKED 건이 남아 있습니다. DLQ 유입은 종결이 아니라 원장의 입력이며, 재처리 여부는 사람이 판단합니다. 조치: docs/runbooks/dlq-recovery.md"
          # --- 구현 ③ PR4(S9): 인증 실패 중 alert 로 올리는 것은 reuse 하나다 ---
          # 401 은 만료 토큰 재시도 같은 기저율이 있어서 임계를 정할 근거가 아직 없다(baseline 미측정).
          # reuse 는 다르다 — 정상 클라이언트는 무효화된 refresh token 을 다시 제시하지 않는다.
          # 발생 자체가 사건이므로 임계가 필요 없다(ADR-0024 D3/§Consequences).
          - uid: peekcart-token-reuse-detected
            title: "Refresh Token Reuse Detected (탈취 의심)"
            condition: B
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: prometheus
                model:
                  # 발급 owner 는 user-service 단독이다(ADR-0010) — 5서비스 regex 로 걸면 없는 series 를 기다린다.
                  expr: "sum by (application)(increase(auth_token_reuse_detected_total{application=~\"user-service\"}[5m]))"
                  instant: true
                  range: false
              - refId: B
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  type: math
                  expression: "$A > 0"
            for: 0m
            labels:
              severity: critical
            annotations:
              summary: "PeekCart refresh token reuse 감지 — {{ $labels.application }}"
              description: "무효화되었거나 이미 로테이션된 refresh token 이 재제시되었습니다. 해당 family 는 전체 무효화되고 access token 은 family deny 로 차단됩니다(ADR-0013 D4). 정상 동시요청은 grace 창에서 흡수되므로, 이 카운터가 오르는 것은 탈취 또는 클라이언트 토큰 관리 결함을 뜻합니다."
